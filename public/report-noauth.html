<!doctype html>
<html lang="ja" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報告・お問い合わせ - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script nonce="%%CSP_NONCE%%">
    (() => {
      const theme = localStorage.getItem('namiki-theme') === 'light' ? 'light' : 'dark';
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme);
    })();
  </script>
  <script nonce="%%CSP_NONCE%%">
    window.onRecaptchaLoad = function() {
      window.dispatchEvent(new Event('recaptcha-loaded'));
    };
  </script>
  <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer nonce="%%CSP_NONCE%%"></script>
  <style nonce="%%CSP_NONCE%%">
    .report-form { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.875rem; font-weight: 600; color: var(--color-text-primary); }
    .required { color: #ef4444; margin-left: 0.25rem; }
    .form-control { width: 100%; padding: 0.625rem 0.875rem; font-size: 0.875rem; border: 1px solid var(--color-border); border-radius: 0.375rem; background: var(--color-bg); color: var(--color-text-primary); }
    .form-control:focus { outline: none; border-color: var(--color-accent-blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25); }
    textarea.form-control { min-height: 120px; resize: vertical; }
    .captcha-container { min-height: 78px; }
    .submit-btn { display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; padding: 0.625rem 1.25rem; border: 0; border-radius: 0.375rem; color: #fff; background: var(--color-accent-blue-dark); cursor: pointer; }
    .submit-btn:disabled { opacity: 0.6; cursor: wait; }
    .form-error { color: var(--color-accent-red); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main class="content-area" style="max-width: 52rem; margin: 0 auto;">
    <div class="app-card content-card">
      <h1 class="content-card-title">問題報告・お問い合わせ</h1>
      <p class="content-card-subtitle">不具合の報告や改善要望、その他のお問い合わせはこちらから送信してください。</p>
      <form id="report-form" class="report-form">
        <div class="form-group">
          <label for="report-type">報告種別 <span class="required">*</span></label>
          <select id="report-type" name="type" class="form-control" required>
            <option value="" disabled selected>選択してください</option>
            <option value="不具合報告">システムの不具合報告</option>
            <option value="機能要望">機能追加・改善の要望</option>
            <option value="不適切コンテンツ報告">不適切なメッセージ・コンテンツの報告</option>
            <option value="その他">その他のお問い合わせ</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-name">お名前 <span class="required">*</span></label>
          <input type="text" id="form-name" name="name" class="form-control" maxlength="100" required>
        </div>
        <div class="form-group">
          <label for="form-email">メールアドレス <span class="required">*</span></label>
          <input type="email" id="form-email" name="email" class="form-control" maxlength="254" required>
        </div>
        <div class="form-group">
          <label for="form-message">報告内容・メッセージ <span class="required">*</span></label>
          <textarea id="form-message" name="message" class="form-control" maxlength="5000" required></textarea>
        </div>
        <div class="captcha-container" id="recaptcha-container"></div>
        <p id="form-error" class="form-error" hidden></p>
        <button type="submit" class="submit-btn">送信する</button>
      </form>
      <p style="margin-top: 1.5rem; font-size: 0.875rem;"><a href="/privacy-noauth">プライバシーポリシー</a> | <a href="/terms-noauth">利用規約</a></p>
    </div>
  </main>
  <script nonce="%%CSP_NONCE%%">
    let recaptchaWidgetId = null;

    function showError(message) {
      const error = document.getElementById('form-error');
      error.textContent = message;
      error.hidden = false;
    }

    function renderRecaptcha() {
      if (!window.grecaptcha || !'%%RECAPTCHA_V2_SITE_KEY%%') {
        showError('reCAPTCHA v2のサイトキーが設定されていないため、現在送信できません。');
        return;
      }
      recaptchaWidgetId = grecaptcha.render('recaptcha-container', {
        sitekey: '%%RECAPTCHA_V2_SITE_KEY%%'
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.grecaptcha) renderRecaptcha();
      else window.addEventListener('recaptcha-loaded', renderRecaptcha, { once: true });

      document.getElementById('report-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector('button[type="submit"]');
        const token = grecaptcha.getResponse(recaptchaWidgetId);
        if (!token) {
          showError('reCAPTCHAの確認を完了してください。');
          return;
        }

        button.disabled = true;
        document.getElementById('form-error').hidden = true;
        try {
          const response = await fetch('/api/reports/noauth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: form.elements.name.value,
              email: form.elements.email.value,
              type: form.elements.type.value,
              subject: form.elements.type.value,
              message: form.elements.message.value,
              recaptchaToken: token
            })
          });
          if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || '送信に失敗しました。');
          }
          window.location.href = '/success.html';
        } catch (error) {
          showError(error.message);
          grecaptcha.reset(recaptchaWidgetId);
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
