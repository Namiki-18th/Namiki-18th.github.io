<!doctype html>
<html lang="ja" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送信エラー</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>

  <main class="content-area">
    <section class="app-card content-card">
      <div class="error-icon-wrapper">
        <svg class="animated-icon" viewBox="0 0 50 50">
          <circle class="circle-path" cx="25" cy="25" r="21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          <path class="cross-line-1" d="M17 17 L33 33" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
          <path class="cross-line-2" d="M33 17 L17 33" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="content-card-title">送信できませんでした</h1>
      <p class="content-card-subtitle">通信または入力内容を確認して、<br>もう一度お試しください。</p>
      <a class="button-primary" href="/report">
        <i class="fa-solid fa-arrow-left"></i>
        報告フォームへ戻る
      </a>
    </section>
