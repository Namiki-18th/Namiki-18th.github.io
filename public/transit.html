<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通情報 - 並木中等教育学校18回生</title>
  <script nonce="%%CSP_NONCE%%">
    try {
      var savedTheme = localStorage.getItem('namiki-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        document.documentElement.classList.toggle('light', savedTheme === 'light');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  
  <style nonce="%%CSP_NONCE%%">
    /* 共通ユーティリティ (index.html準拠) */
    .user-info-header { display: flex; align-items: center; gap: 0.75rem; }
    .popup-user-avatar { width: 2.25rem; height: 2.25rem; border-radius: 9999px; object-fit: cover; border: 1px solid var(--color-border); flex-shrink: 0; }
    .user-info-text { flex: 1; min-width: 0; }
    .sidebar-avatar-image, .mobile-avatar-image { object-fit: cover; border-radius: 9999px; }
    .cursor-pointer { cursor: pointer; }
    .u-hidden { display: none; }
    .mt-quarter-rem { margin-top: 0.25rem; }
    .nav-report-btn { margin-top: auto; margin-bottom: 1rem; }
    .popup-user-info-header { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--color-border); margin-bottom: 0.5rem; }
    .popup-user-name { display: block; font-weight: 600; color: var(--color-text-primary); font-size: 0.875rem; }
    .popup-user-email { display: block; font-size: 0.75rem; color: var(--color-text-muted); margin-top: 0.125rem; }
    .popup-divider { border-top: 1px solid var(--color-border); margin: 0.25rem 0; }
    .theme-toggle-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); }

    /* 全画面レイアウトの構築 */
    body {
      margin: 0;
      overflow: hidden; /* 全体スクロールを無効化し、アプリライクに */
    }
    .app-main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    @supports (height: 100dvh) {
      .app-main { height: 100dvh; }
    }
    
    .content-area {
      flex: 1; /* 残りの高さをすべて使う */
      display: flex;
      flex-direction: column;
      padding: 1rem;
      min-height: 0; /* flexbox内での縮小を許可 */
    }

    /* 交通マップ (.tm-*) */
    .tm-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; flex: none; }
    .tm-chipset { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .7rem; min-width: 0; }
    .tm-group { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-sep { flex: none; width: 1px; align-self: stretch; min-height: 22px; background: rgba(127, 127, 127, .38); }
    .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }

    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; white-space: nowrap; cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tm-chip:hover, .tm-btn:hover:not(:disabled) { background: rgba(127, 127, 127, .14); }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="true"]:hover { background: rgba(59, 130, 246, .26); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip[aria-pressed="false"]:hover { opacity: .92; }
    .tm-chip:focus-visible, .tm-btn:focus-visible { outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px; }
    .tm-chip[hidden] { display: none; }
    .tm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tm-btn svg { width: 1rem; height: 1rem; flex: none; }
    @media (pointer: coarse) { .tm-chip, .tm-btn { min-height: 44px; } }

    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.rail { background: #2563eb; }
    .tm-dot.bus { background: #f59e0b; }
    .tm-dot.other { background: #7c3aed; }
    .tm-dot.late { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-dot.local { background: #10b981; }
    .tm-dot.expw { background: #3b82f6; }
    .tm-dot.closure { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }

    .tm-updated { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; opacity: .85; font-variant-numeric: tabular-nums; }
    .tm-updated::before { content: ""; flex: none; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; opacity: .45; }
    .tm-updated[data-state="ok"]::before { background: #10b981; opacity: 1; }
    .tm-updated[data-state="stale"]::before { background: #f59e0b; opacity: 1; }
    .tm-updated[data-state="error"]::before { background: #dc2626; opacity: 1; }

    .tm-map-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
    }
    .tm-map {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; isolation: isolate; box-sizing: border-box;
      height: 100% !important;
      border: 1px solid rgba(127, 127, 127, .32); border-radius: 14px; overflow: hidden; background: #d6dee8;
      --tm-pop-bg: #fff; --tm-pop-fg: #1e293b; --tm-pop-sub: #64748b; --tm-pop-late: #b91c1c; --tm-pop-early: #047857;
    }
    html.dark .tm-map {
      background: #18212c;
      --tm-pop-bg: #1e293b; --tm-pop-fg: #e2e8f0; --tm-pop-sub: #94a3b8; --tm-pop-late: #fca5a5; --tm-pop-early: #6ee7b7;
    }
    html.dark .tm-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92) saturate(.8); }
    .tm-map .leaflet-control-attribution { font-size: 11px; }

    /* ポップアップ等のスタイル省略(既存のまま) */
    .tm-msg { position: absolute; left: 50%; top: .75rem; transform: translateX(-50%); z-index: 900; max-width: min(92%, 34rem); padding: .45rem .9rem; border-radius: 999px; font-size: .82rem; text-align: center; color: #fff; background: rgba(15, 23, 42, .86); pointer-events: none; }
    .tm-msg[hidden] { display: none; }
    .tm-pop { position: absolute; z-index: 460; width: 15.5rem; max-width: calc(100% - 16px); padding: .7rem .8rem .6rem; border-radius: 12px; color: var(--tm-pop-fg); background: var(--tm-pop-bg); border: 1px solid rgba(127, 127, 127, .25); box-shadow: 0 6px 22px rgba(0, 0, 0, .3); font-size: .82rem; line-height: 1.45; }
    .tm-pop[hidden] { display: none; }

    /* スマホ対応（レスポンシブデザイン） */
    @media (max-width: 767px) {
      .sidebar { display: none !important; }
      .mobile-topbar { display: flex !important; position: sticky; top: 0; z-index: 50; }
      
      /* 下部タブバーを横スクロール可能にして全機能へアクセス可能に */
      .mobile-tab-bar { 
        display: flex !important; 
        position: fixed; 
        bottom: 0; 
        width: 100%; 
        z-index: 50; 
        overflow-x: auto;
        white-space: nowrap;
        justify-content: flex-start;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background-color: var(--bg-card, #ffffff);
        border-top: 1px solid var(--color-border);
      }
      .dark .mobile-tab-bar { background-color: var(--bg-card, #1f2937); }
      .mobile-tab-bar::-webkit-scrollbar { display: none; }
      .mobile-nav-button { flex-shrink: 0; padding: 0.5rem 1rem; }

      /* モバイル時は下部タブバーの分、余白を空けてマップが隠れないようにする */
      .content-area { padding: 0.5rem; padding-bottom: 60px; }

      /* モバイル用ポップアップメニューのスタイル */
      #mobile-account-popup-menu {
        position: fixed;
        top: 60px;
        right: 10px;
        z-index: 100;
        background-color: var(--bg-card, #ffffff);
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--color-border);
      }
      .dark #mobile-account-popup-menu { background-color: var(--bg-card, #1f2937); }

      /* 絞り込みボタンの横スクロール対応 */
      .tm-toolbar { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: .4rem; }
      .tm-chipset {
        flex-wrap: nowrap; overflow-x: auto; padding-right: 1.5rem; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 1.5rem), transparent);
        mask-image: linear-gradient(to right, #000 calc(100% - 1.5rem), transparent);
      }
      .tm-chipset::-webkit-scrollbar { display: none; }
      .tm-group { flex-wrap: nowrap; }
      .tm-chip { flex: none; }
      .tm-tools { justify-content: space-between; }
    }
    @media (min-width: 768px) {
      .mobile-topbar { display: none !important; }
      .mobile-tab-bar { display: none !important; }
      #mobile-account-popup-menu { display: none !important; }
    }
  </style>
</head>

          <img id="mobile-user-avatar" src="data:image/svg+xml;utf8,<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' width='32' height='32' viewBox='0 0 32 32'><rect width='100%' height='100%' fill='%233b82f6'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-size='16' font-family='sans-serif'>U</text></svg>" alt="Avatar" class="mobile-avatar-image" />

    <!-- モバイル用アカウントポップアップ (index.htmlと同一) -->

      <div class="user-info-header popup-user-info-header">

        <div class="user-info-text">
          <span id="mobile-popup-user-name" class="popup-user-name truncate">読み込み中...</span>

        管理者設定
      </button>
      <button id="btn-personal-settings-mobile" class="account-popup-item">
        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        個人用設定
      </button>
      <div class="popup-divider"></div>
      <a href="/logout" class="account-popup-item text-red">
        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        ログアウト
      </a>
    </div>

    <!-- モバイル用下部タブバー (index.htmlと同一、交通情報をactiveに) -->
    <div class="mobile-tab-bar">
      <button data-href="/index" class="mobile-nav-button">ホーム</button>
      <button data-href="/schedule" class="mobile-nav-button">時間割</button>
      <button data-href="/notice" class="mobile-nav-button">お知らせ</button>
      <button data-href="/link" class="mobile-nav-button">リンク</button>
      <button data-href="/calendar" class="mobile-nav-button">カレンダー</button>
      <button data-href="/classroom" class="mobile-nav-button">Classroom</button>
      <button data-href="/transit" class="mobile-nav-button active">交通情報</button>
      <button data-href="/privacy" class="mobile-nav-button">プライバシー</button>
      <button data-href="/terms" class="mobile-nav-button">利用規約</button>
      <button data-href="/report" class="mobile-nav-button">報告</button>
    </div>

    <!-- マップ領域（余った空間をすべて使う） -->
    <main class="content-area">
      <section class="tm-section" aria-label="交通マップ">
        <div class="tm-toolbar">
          <div class="tm-chipset" role="group" aria-label="地図に表示するもの">
            <!-- 交通用レイヤー -->
            <div class="tm-group" role="group" aria-label="列車・バス">
              <button type="button" class="tm-chip" data-tm-layer="rail" aria-pressed="true"><span class="tm-dot rail" aria-hidden="true"></span>列車 <span class="tm-count" data-tm-count="rail"></span></button>
              <button type="button" class="tm-chip" data-tm-layer="bus" aria-pressed="true"><span class="tm-dot bus" aria-hidden="true"></span>バス <span class="tm-count" data-tm-count="bus"></span></button>

              <button type="button" class="tm-chip" data-tm-layer="delayed" aria-pressed="false"><span class="tm-dot late" aria-hidden="true"></span>3分以上の遅れだけ</button>

              <button type="button" class="tm-chip" data-tm-layer="expw" aria-pressed="false">
                <span class="tm-dot expw" aria-hidden="true"></span>高速道路 <span class="tm-count" data-tm-count="expw"></span>
              </button>
              <button type="button" class="tm-chip" data-tm-layer="closure" aria-pressed="false">
                <span class="tm-dot closure" aria-hidden="true"></span>通行止め・渋滞のみ
              </button>
            </div>

          <div class="tm-tools">
            <button type="button" class="tm-btn" id="tm-geolocation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg>
              <span class="tm-btn-label">現在地へ</span>

            <button type="button" class="tm-btn" id="tm-home">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z" /><circle cx="12" cy="10" r="2.5" /></svg>
              <span class="tm-btn-label">学校の周辺へ</span>

          <div id="tm-map" class="tm-map" role="application" aria-label="鉄道・バス・道路の状況マップ。矢印キーで移動、プラスとマイナスで拡大縮小できます。"></div>

        </div>
      </section>

  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script nonce="%%CSP_NONCE%%">
    const rawFetch = window.fetch.bind(window);
    let serverTimeObj = null;

    // data-href による画面遷移
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-href]').forEach(el => {
        el.addEventListener('click', (e) => {
          window.location.href = el.dataset.href;
        });
      });
      initServerTime();
      loadProfile();
    });

    // アカウントメニューの開閉 (PCとモバイル両対応)
    function toggleAccountMenu(event, isMobile = false) {
      if (event) event.stopPropagation();
      const targetId = isMobile ? 'mobile-account-popup-menu' : 'account-popup-menu';
      const menu = document.getElementById(targetId);
      if (menu) {
        menu.classList.toggle('show');
        if (isMobile) {
          menu.style.display = menu.classList.contains('show') ? 'block' : 'none';
        }
      }
    }

    // メニュー外クリックで閉じる処理
    document.addEventListener('click', (event) => {
      const menuPC = document.getElementById('account-popup-menu');
      const toggleBtnPC = document.getElementById('sidebar-user-toggle');
      if (menuPC && menuPC.classList.contains('show')) {
        if (!menuPC.contains(event.target) && (!toggleBtnPC || !toggleBtnPC.contains(event.target))) {
          menuPC.classList.remove('show');
        }
      }
      const menuMobile = document.getElementById('mobile-account-popup-menu');
      const toggleBtnMobile = document.getElementById('mobile-user-avatar-btn');
      if (menuMobile && menuMobile.classList.contains('show')) {
        if (!menuMobile.contains(event.target) && (!toggleBtnMobile || !toggleBtnMobile.contains(event.target))) {
          menuMobile.classList.remove('show');
          menuMobile.style.display = 'none';
        }
      }
    });

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      if(toggleSwitch) {
        if (document.documentElement.classList.contains('dark')) {
          toggleSwitch.classList.add('on');
        } else {
          toggleSwitch.classList.remove('on');
        }
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        localStorage.setItem('namiki-theme', 'light');
        if (toggleSwitch) toggleSwitch.classList.remove('on');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        localStorage.setItem('namiki-theme', 'dark');
        if (toggleSwitch) toggleSwitch.classList.add('on');
      }
    }

    // イベント委譲 (全体クリック監視)
    document.addEventListener('click', (e) => {
      if (e.target.closest('.theme-toggle-btn')) {
        toggleTheme();
        return;
      }
      if (e.target.closest('#sidebar-user-toggle')) {
        toggleAccountMenu(e, false);
        return;
      }
      if (e.target.closest('#mobile-user-avatar-btn')) {
        toggleAccountMenu(e, true);
        return;
      }
      if (e.target.closest('#btn-admin-settings') || e.target.closest('#btn-admin-settings-mobile')) {
        window.location.href = '/admin';
        return;
      }
      if (e.target.closest('#btn-personal-settings') || e.target.closest('#btn-personal-settings-mobile')) {
        window.location.href = '/setting';
        return;
      }
    });

    initThemeToggle();

    // サーバー時刻 (index.htmlと統一)
    async function initServerTime() {
      try {
        const urlObj = new URL(window.location.href);
        urlObj.searchParams.set('_t', Date.now());
        const res = await rawFetch(urlObj.toString(), { method: 'HEAD' });
        const dateHeader = res.headers.get('Date');
        if (dateHeader) {
          serverTimeObj = new Date(dateHeader);
        } else {
          serverTimeObj = new Date();
        }
      } catch (err) {
        serverTimeObj = new Date();
      }
      updateTimeDisplays();
      setInterval(() => {
        if(serverTimeObj) {
          serverTimeObj.setSeconds(serverTimeObj.getSeconds() + 1);
          updateTimeDisplays();
        }
      }, 1000);
    }

    function updateTimeDisplays() {
      if (!serverTimeObj) return;
      const timeStr = serverTimeObj.toLocaleTimeString('ja-JP', { hour12: false });
      const displays = document.querySelectorAll('.server-time-display');
      displays.forEach(el => { el.textContent = timeStr; });
    }

    // 既定アバター
    function createAvatarDataUri(text) {
      const initial = encodeURIComponent(text ? text.charAt(0) : 'U');
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><rect width="100%" height="100%" fill="%233b82f6"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="%23ffffff" font-size="20" font-family="sans-serif">${initial}</text></svg>`;
    }

    async function loadProfile() {
      try {
        const response = await rawFetch('/api/profile');
        if (response.status === 401) { window.location.href = '/login'; return; }
        if (!response.ok) return;
        const profile = await response.json();
        
        if (document.getElementById('sidebar-user-id')) document.getElementById('sidebar-user-id').textContent = (profile.id && profile.id !== 'Unknown') ? profile.id : '学籍番号未設定';
        if (document.getElementById('sidebar-user-name')) document.getElementById('sidebar-user-name').textContent = profile.name || 'ユーザー';
        if (document.getElementById('popup-user-name')) document.getElementById('popup-user-name').textContent = profile.name || 'ユーザー';
        if (document.getElementById('popup-user-email')) document.getElementById('popup-user-email').textContent = profile.email || '未設定';
        if (document.getElementById('mobile-popup-user-name')) document.getElementById('mobile-popup-user-name').textContent = profile.name || 'ユーザー';
        if (document.getElementById('mobile-popup-user-email')) document.getElementById('mobile-popup-user-email').textContent = profile.email || '未設定';

        const userAvatar = (profile.picture && profile.picture !== 'admin.png') ? profile.picture : createAvatarDataUri(profile.name);
        if (document.getElementById('sidebar-user-avatar')) document.getElementById('sidebar-user-avatar').src = userAvatar;
        if (document.getElementById('popup-user-avatar')) document.getElementById('popup-user-avatar').src = userAvatar;
        if (document.getElementById('mobile-popup-user-avatar')) document.getElementById('mobile-popup-user-avatar').src = userAvatar;
        if (document.getElementById('mobile-user-avatar')) document.getElementById('mobile-user-avatar').src = userAvatar;
      } catch (e) {
        console.error('Profile load failed', e);
      }
    }
  </script>
</body>
</html>
