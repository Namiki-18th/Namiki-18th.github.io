  <style nonce="%%CSP_NONCE%%">
    /* ===== 画面レイアウトの全画面化調整 ===== */
    .app-main {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 1rem;
    }
    .content-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* ===== 交通マップ (.tm-*) ===== */
    .tm-section {
      margin-top: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; flex: none; }
    .tm-chipset, .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; cursor: pointer;
    }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip:focus-visible, .tm-btn:focus-visible, .tm-pop-close:focus-visible {
      outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px;
    }
    .tm-chip[hidden] { display: none; }
    .tm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.rail { background: #2563eb; }
    .tm-dot.bus { background: #f59e0b; }
    .tm-dot.other { background: #7c3aed; }
    .tm-dot.late { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }
    .tm-updated { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; }

    .tm-map-wrap {
      position: relative;
      flex: 1;
      height: 100%;
      min-height: 0;
    }
    .tm-map {
      position: relative; isolation: isolate;
      height: 100% !important;
      width: 100%;
      border: 1px solid rgba(127, 127, 127, .32); border-radius: 14px; overflow: hidden; background: #d6dee8;
    }
    html.dark .tm-map { background: #18212c; }
    html.dark .tm-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92) saturate(.8); }
    .tm-map .leaflet-control-attribution { font-size: 11px; }
    .tm-canvas { position: absolute; left: 0; top: 0; z-index: 450; pointer-events: none; }
    .tm-msg {
      position: absolute; left: 50%; top: .75rem; transform: translateX(-50%); z-index: 900; max-width: min(92%, 34rem);
      padding: .45rem .9rem; border-radius: 999px; font-size: .82rem; text-align: center;
      color: #fff; background: rgba(15, 23, 42, .86); pointer-events: none;
    }
    .tm-msg[hidden] { display: none; }
    .tm-msg.fatal { border-radius: 12px; pointer-events: auto; background: rgba(153, 27, 27, .92); }

    .tm-pop {
      position: absolute; z-index: 460; width: 15.5rem; max-width: calc(100% - 16px); padding: .7rem .8rem .6rem;
      border-radius: 12px; color: #1e293b; background: #fff; box-shadow: 0 6px 22px rgba(0, 0, 0, .3);
      font-size: .82rem; line-height: 1.45;
    }
    .tm-pop[hidden] { display: none; }
    .tm-pop-title { display: flex; align-items: center; gap: .45rem; margin: 0 1.6rem .4rem 0; font-weight: 700; font-size: .92rem; }
    .tm-pop-close {
      position: absolute; right: .35rem; top: .3rem; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: transparent; color: #475569; font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    .tm-pop-list { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .7rem; margin: 0; }
    .tm-pop-list dt { color: #64748b; }
    .tm-pop-list dd { margin: 0; word-break: break-word; }
    .tm-pop-late { color: #b91c1c; font-weight: 700; }
    .tm-pop-early { color: #047857; }

    @media (max-width: 640px) {
      .tm-pop { width: 14rem; }
      .app-main { padding: .5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .tm-chip, .tm-btn { transition: none; } }
  </style>
</head>

  <script nonce="%%CSP_NONCE%%">
    const rawFetch = window.fetch.bind(window);

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      toggleSwitch?.classList.toggle('on', document.documentElement.classList.contains('dark'));
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      html.classList.toggle('dark', !isDark);
      html.classList.toggle('light', isDark);
      localStorage.setItem('namiki-theme', isDark ? 'light' : 'dark');
      initThemeToggle();
    }

    async function loadProfile() {
      const response = await fetch('/api/profile');
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) return;
      const profile = await response.json();
      const studentId = profile.id && profile.id !== 'Unknown' ? profile.id : '学籍番号未設定';
      document.getElementById('sidebar-user-id').textContent = studentId;
      document.getElementById('sidebar-user-name').textContent = profile.name || 'ユーザー';
      document.getElementById('popup-user-name').textContent = profile.name || 'ユーザー';
      document.getElementById('popup-user-email').textContent = profile.email || 'メールアドレス未設定';
      const avatar = profile.picture && profile.picture !== 'admin.png'
        ? profile.picture
        : `https://via.placeholder.com/40/3b82f6/ffffff?text=${encodeURIComponent((profile.name || 'U').charAt(0))}`;
      document.getElementById('sidebar-user-avatar').src = avatar;
      document.getElementById('popup-user-avatar').src = avatar;
      document.getElementById('mobile-user-avatar').src = avatar;
    }

    document.getElementById('sidebar-user-toggle')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('account-popup-menu')?.classList.toggle('show');
    });
    document.getElementById('mobile-user-avatar-btn')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('mobile-account-popup-menu')?.classList.toggle('show');
    });
    document.getElementById('btn-admin-settings')?.addEventListener('click', () => { window.location.href = '/admin'; });
    document.getElementById('btn-personal-settings')?.addEventListener('click', () => { window.location.href = '/setting'; });
    document.getElementById('btn-toggle-theme-popup')?.addEventListener('click', toggleTheme);
    document.addEventListener('click', () => {
      document.getElementById('account-popup-menu')?.classList.remove('show');
      document.getElementById('mobile-account-popup-menu')?.classList.remove('show');
    });
    initThemeToggle();
    loadProfile().catch(() => {});

    document.addEventListener('click', (event) => {
      if (event.target.closest('#sidebar-user-toggle')) {
        event.stopPropagation();
        document.getElementById('account-popup-menu')?.classList.toggle('show');
      }
      if (event.target.closest('#mobile-user-avatar-btn')) {
        event.stopPropagation();
        const menu = document.getElementById('mobile-account-popup-menu');
        menu?.classList.toggle('show');
        if (menu) menu.style.display = menu.classList.contains('show') ? 'block' : 'none';
      }
    });
  </script>
  <script nonce="%%CSP_NONCE%%">
    // ===== 交通マップ =====
    (() => {
      'use strict';
      const rf = typeof rawFetch === 'function' ? rawFetch : window.fetch.bind(window);
      const $ = (id) => document.getElementById(id);
      const MODES = ['rail', 'bus', 'other'];
      const MODE_LABEL = { rail: '列車', bus: 'バス', other: 'その他' };
      const MODE_COLOR = { rail: '#2563eb', bus: '#f59e0b', other: '#7c3aed' };
      const LATE_SEC = 180;
      const BLANK_TILE = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
      const PREF_KEY = 'namiki-transit-map';
      const HIT_PAD = (window.L && L.Browser && L.Browser.mobile) ? 8 : 2;

      const S = {
        map: null, overlay: null, tiles: null, cfg: null,
        on: { rail: true, bus: true, other: true, delayed: false },
        vehicles: [], vIndex: new Map(),
        feeds: new Map(), statics: new Map(),
        selected: null, seq: { v: 0 }, updatedAt: 0, stale: false, truncated: false, error: false,
        ignoreMapClick: false 
      };

      async function api(url) {
        const res = await rf(url, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
        if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }
      const clock = (ms) => (ms ? new Date(ms).toLocaleTimeString('ja-JP', { hour12: false }) : '--:--:--');
      const isLate = (v) => typeof v.d === 'number' && v.d >= LATE_SEC;
      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      
      // ★最適化: メッセージ更新を requestAnimationFrame にラップ
      function showMsg(text, fatal) {
        requestAnimationFrame(() => {
          const box = $('tm-msg');
          if (!box) return;
          if (!text) { box.hidden = true; return; }
          box.textContent = text;
          box.classList.toggle('fatal', Boolean(fatal));
          box.hidden = false;
        });
      }
      
      function loadPrefs() {
        try {
          const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
          Object.keys(S.on).forEach((k) => { if (typeof p.on?.[k] === 'boolean') S.on[k] = p.on[k]; });
        } catch (_) {}
      }
      function savePrefs() {
        try { localStorage.setItem(PREF_KEY, JSON.stringify({ on: S.on })); } catch (_) {}
      }

      function buildPopup(container) {
        const box = el('div', 'tm-pop');
        box.hidden = true;
        box.setAttribute('role', 'dialog');
        box.setAttribute('aria-label', '詳細');
        const close = el('button', 'tm-pop-close', '×');
        close.type = 'button';
        close.setAttribute('aria-label', '閉じる');
        const title = el('div', 'tm-pop-title');
        const list = el('dl', 'tm-pop-list');
        box.append(close, title, list);
        container.appendChild(box);
        if (window.L && L.DomEvent) { L.DomEvent.disableClickPropagation(box); L.DomEvent.disableScrollPropagation(box); }
        close.addEventListener('click', () => select(null));
        return { box, title, list };
      }

      function delayText(d) {
        if (typeof d !== 'number') return { text: '', cls: '' };
        if (d >= 60) return { text: `約${Math.round(d / 60)}分遅れ`, cls: d >= LATE_SEC ? 'tm-pop-late' : '' };
        if (d <= -60) return { text: `約${Math.round(-d / 60)}分早い`, cls: 'tm-pop-early' };
        return { text: 'ほぼ定刻', cls: '' };
      }

      function fillPopup(pop, item) {
        pop.title.textContent = '';
        pop.list.textContent = '';
        const row = (k, v, cls) => {
          if (v === '' || v === null || v === undefined) return;
          pop.list.append(el('dt', '', k), el('dd', cls || '', String(v)));
        };
        
        if (item.kind === 'vehicle') {
          const v = item.ref;
          const feed = S.feeds.get(v.f);
          const dot = el('span', 'tm-dot ' + v.m);
          pop.title.append(dot, document.createTextNode(`${MODE_LABEL[v.m] || '車両'}${v.r ? ' ' + v.r : ''}`));
          row('事業者', feed ? feed.label : '');
          const dl = delayText(v.d);
          row('遅れ', dl.text, dl.cls);
          if (v.sn) row('次の停車', v.st === 1 ? `${v.sn}に停車中` : v.st === 0 ? `まもなく ${v.sn}` : `${v.sn}に向かっています`);
          row('速度', typeof v.s === 'number' ? `時速${v.s}km` : '');
          row('車両', v.l);
          row('位置の時刻', v.ts ? clock(v.ts * 1000) : '');
        } else if (item.kind === 'school') {
          pop.title.append(el('span', 'tm-dot late'), document.createTextNode(S.cfg.school.name));
          row('種別', '学校');
        } else if (item.kind === 'station') {
          const dot = el('span', 'tm-dot');
          dot.style.background = '#475569';
          pop.title.append(dot, document.createTextNode(item.name));
          row('乗り入れ', item.routes && item.routes.length > 0 ? item.routes.join('、') : '情報なし');
        }
      }

      function createOverlay(map) {
        const container = map.getContainer();
        const canvas = el('canvas', 'tm-canvas');
        canvas.setAttribute('aria-hidden', 'true');
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const pop = buildPopup(container);
        let w = 0, h = 0, dpr = 1, raf = 0;
        let hits = [];

        function fit() {
          const size = map.getSize();
          w = size.x; h = size.y; dpr = window.devicePixelRatio || 1;
          canvas.width = Math.max(1, Math.round(w * dpr));
          canvas.height = Math.max(1, Math.round(h * dpr));
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
        }

        function arrow(x, y, deg, size) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate((deg * Math.PI) / 180);
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size * 0.78, size * 0.85);
          ctx.lineTo(0, size * 0.4);
          ctx.lineTo(-size * 0.78, size * 0.85);
          ctx.closePath();
          ctx.stroke();
          ctx.fill();
          ctx.restore();
        }

        function draw() {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          hits = [];
          const z = map.getZoom();
          const sel = S.selected;

          const list = S.on.delayed ? S.vehicles.filter(isLate) : S.vehicles;
          const size = z >= 15 ? 11 : z >= 13 ? 9 : 7;
          ctx.lineWidth = 3;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#fff';
          for (const pass of [false, true]) {
            for (const v of list) {
              if (isLate(v) !== pass) continue;
              const p = map.latLngToContainerPoint([v.la, v.lo]);
              if (p.x < -20 || p.y < -20 || p.x > w + 20 || p.y > h + 20) continue;
              ctx.fillStyle = (v.m === 'rail' && v.k) || MODE_COLOR[v.m] || MODE_COLOR.other;
              if (pass) {
                ctx.save();
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size + 4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
              }
              if (typeof v.b === 'number' && z >= 12) arrow(p.x, p.y, v.b, size);
              else { ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.7, 0, Math.PI * 2); ctx.stroke(); ctx.fill(); }
              hits.push({ x: p.x, y: p.y, r: size + 6 + HIT_PAD, kind: 'vehicle', id: v.id });
              if (sel && sel.kind === 'vehicle' && sel.id === v.id) {
                ctx.save();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size + 8, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          if (S.cfg) {
            const p = map.latLngToContainerPoint([S.cfg.school.lat, S.cfg.school.lon]);
            if (p.x > -20 && p.y > -20 && p.x < w + 20 && p.y < h + 20) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
              ctx.fillStyle = '#e11d48';
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2.5;
              ctx.fill();
              ctx.stroke();
              ctx.fillStyle = '#fff';
              ctx.font = 'bold 12px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('学', p.x, p.y + 0.5);
              hits.push({ x: p.x, y: p.y, r: 14 + HIT_PAD, kind: 'school', id: 'school' });
            }
          }
          placePopup();
        }

        function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

        function hitAt(pt) {
          let best = null;
          let bestD = Infinity;
          for (let i = hits.length - 1; i >= 0; i--) {
            const hit = hits[i];
            const d = (hit.x - pt.x) ** 2 + (hit.y - pt.y) ** 2;
            if (d <= hit.r * hit.r && d < bestD) { best = hit; bestD = d; }
          }
          return best;
        }

        function lookup(sel) {
          if (!sel) return null;
          if (sel.kind === 'vehicle') { const v = S.vIndex.get(sel.id); return v ? { kind: 'vehicle', ref: v, la: v.la, lo: v.lo } : null; }
          if (sel.kind === 'station') { return { kind: 'station', name: sel.name, routes: sel.routes, la: sel.la, lo: sel.lo }; }
          return S.cfg ? { kind: 'school', ref: null, la: S.cfg.school.lat, lo: S.cfg.school.lon } : null;
        }

        function placePopup() {
          const item = lookup(S.selected);
          if (!item) { pop.box.hidden = true; return; }
          const p = map.latLngToContainerPoint([item.la, item.lo]);
          const size = map.getSize();
          pop.box.hidden = false;
          const pw = pop.box.offsetWidth || 248;
          const ph = pop.box.offsetHeight || 140;
          const x = Math.min(Math.max(p.x, pw / 2 + 8), Math.max(pw / 2 + 8, size.x - pw / 2 - 8));
          let y = p.y - ph - 18;
          if (y < 8) y = Math.min(p.y + 18, Math.max(8, size.y - ph - 8));
          pop.box.style.left = Math.round(x - pw / 2) + 'px';
          pop.box.style.top = Math.round(y) + 'px';
        }

        function refreshPopup() {
          const item = lookup(S.selected);
          if (item) fillPopup(pop, item); else { S.selected = null; pop.box.hidden = true; }
        }

        map.on('move zoom moveend zoomend resize', () => { if (map.getSize().x !== w || map.getSize().y !== h) fit(); schedule(); });
        fit();
        return { schedule, hitAt, refreshPopup, fit };
      }

      function select(sel) {
        S.selected = sel;
        if (S.overlay) { S.overlay.refreshPopup(); S.overlay.schedule(); }
      }

      // ★最適化: カウント表示の更新を requestAnimationFrame にラップ
      function updateCounts() {
        const counts = { rail: 0, bus: 0, other: 0 };
        S.vehicles.forEach((v) => { if (counts[v.m] !== undefined) counts[v.m]++; });
        requestAnimationFrame(() => {
          MODES.forEach((m) => {
            const badge = document.querySelector(`[data-tm-count="${m}"]`);
            if (badge) badge.textContent = S.on[m] ? String(counts[m]) : '';
          });
        });
        return counts;
      }

      function afterVehicles() {
        if (!S.map) return;
        S.vIndex = new Map(S.vehicles.map((v) => [v.id, v]));
        updateCounts();
        
        // ★最適化: 日時等のテキスト更新を requestAnimationFrame にラップ
        requestAnimationFrame(() => {
          const status = $('tm-updated');
          if (status) {
            if (S.error) status.textContent = '更新できませんでした。自動で再試行します';
            else if (S.stale) status.textContent = `位置データが古くなっています(最終 ${clock(S.updatedAt)})`;
            else status.textContent = `最終更新 ${clock(S.updatedAt)}` + (S.truncated ? ' ・ 表示数を制限中(拡大すると全て表示)' : '');
          }
        });

        const shown = S.on.delayed ? S.vehicles.filter(isLate).length : S.vehicles.length;
        const anyMode = MODES.some((m) => S.on[m]);
        if (S.error && !S.vehicles.length) showMsg('位置データを取得できませんでした。自動で再試行します。');
        else if (!anyMode) showMsg('列車・バスの表示がすべてオフです。上のボタンで表示できます。');
        else if (S.updatedAt && shown === 0) showMsg(S.on.delayed ? 'この範囲に3分以上遅れている列車・バスはありません。' : 'この範囲に走行中の列車・バスの位置情報はありません。地図を動かすか、縮小してみてください。');
        else showMsg('');
        
        if (S.overlay) { S.overlay.refreshPopup(); S.overlay.schedule(); }
      }

      async function loadVehicles() {
        if (!S.map || document.hidden) return;
        const seq = ++S.seq.v;
        const modes = MODES.filter((m) => S.on[m]);
        if (!modes.length) { S.vehicles = []; S.error = false; afterVehicles(); return; }
        try {
          const bbox = encodeURIComponent(S.map.getBounds().pad(0.15).toBBoxString());
          const data = await api(`/api/transit/map/vehicles?bbox=${bbox}&modes=${modes.join(',')}&limit=3000`);
          if (seq !== S.seq.v) return;
          S.vehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
          S.updatedAt = data.updatedAt || 0;
          S.stale = Boolean(data.stale);
          S.truncated = Boolean(data.truncated);
          S.error = false;
        } catch (_) {
          if (seq !== S.seq.v) return;
          S.error = true;
        }
        afterVehicles();
      }

      async function loadInfo() {
        try {
          const info = await api('/api/transit/map/info');
          S.feeds = new Map(info.feeds.map((f) => [f.id, f]));
          S.statics = new Map((info.statics || []).map((s) => [s.id, s]));
          const chip = document.querySelector('[data-tm-layer="other"]');
          if (chip) chip.hidden = !info.feeds.some((f) => f.kind === 'vehicle' && f.mode === 'other');
        } catch (_) {}
      }

      // ===== 路線図の設定 =====
      let routeLayer = null;

      function getRouteColor(props) {
        if (props.color) return props.color;
        if (props.line_color) return props.line_color;
        const name = props.N02_004 || props.N02_003 || props.company || props.route_name || props.name || '';
        if (!name) return '#64748b';
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash % 360);
        return `hsl(${hue}, 70%, 45%)`;
      }

      function getRouteWeight(zoom) {
        if (zoom >= 16) return 8;
        if (zoom >= 14) return 5;
        if (zoom >= 12) return 3;
        return 1.5;
      }

      async function loadGeoJsonRoutes() {
        if (!S.map) return;
        try {
          const url = '/api/transit/railroadsection';
          let res;
          
          if ('caches' in window) {
            const cache = await caches.open('namiki-transit-routes-v1');
            res = await cache.match(url);
            if (!res) {
              res = await rf(url, { headers: { 'Accept': 'application/json' } });
              if (res.ok) await cache.put(url, res.clone());
            }
          } else {
            res = await rf(url, { headers: { 'Accept': 'application/json' } });
          }

          if (!res.ok) throw new Error('HTTP Error: ' + res.status);
          const geojson = await res.json();

          if (!S.map.getPane('transit-routes')) {
            S.map.createPane('transit-routes');
            S.map.getPane('transit-routes').style.zIndex = 400;
          }
          const routeRenderer = L.canvas({ padding: 0.1, pane: 'transit-routes' });
          
          routeLayer = L.geoJSON(geojson, {
            renderer: routeRenderer,
            interactive: false,
            style: (feature) => {
              const props = feature.properties || {};
              return {
                color: getRouteColor(props),
                weight: getRouteWeight(S.map.getZoom()),
                opacity: 0.6
              };
            }
          }).addTo(S.map);

          S.map.on('zoomend', () => {
            if (routeLayer) {
              const currentZoom = S.map.getZoom();
              routeLayer.setStyle(() => ({
                weight: getRouteWeight(currentZoom)
              }));
            }
          });

        } catch (err) {
          console.error('路線図データの取得に失敗:', err);
        }
      }

      // ===== 駅 (Station) のGeoJSONレンダリング処理 =====
      function getStationWeights(zoom) {
        const routeW = getRouteWeight(zoom);
        return {
          bg: routeW + 4,
          fg: Math.max(1, routeW + 1)
        };
      }

      function getStationName(props) {
        if (!props) return 'Unknown';
        return props.name || props.station_name || props.N02_005 || props.station || 'Unknown';
      }

      async function loadGeoJsonStations() {
        if (!S.map) return;
        try {
          const url = '/api/transit/station';
          let res;
          
          if ('caches' in window) {
            const cache = await caches.open('namiki-transit-stations-v1');
            res = await cache.match(url);
            if (!res) {
              res = await rf(url, { headers: { 'Accept': 'application/json' } });
              if (res.ok) await cache.put(url, res.clone());
            }
          } else {
            res = await rf(url, { headers: { 'Accept': 'application/json' } });
          }

          if (!res.ok) throw new Error('HTTP Error: ' + res.status);
          const geojson = await res.json();

          if (!S.map.getPane('transit-stations')) {
            S.map.createPane('transit-stations');
            S.map.getPane('transit-stations').style.zIndex = 410; 
          }
          const stationRenderer = L.canvas({ padding: 0.1, pane: 'transit-stations' });
          
          const stationGroups = new Map();
          const unknownStations = [];

          L.geoJSON(geojson, {
            onEachFeature: (feature, layer) => {
              const name = getStationName(feature.properties);
              const center = layer.getBounds ? layer.getBounds().getCenter() : (layer.getLatLng ? layer.getLatLng() : null);
              
              if (center) {
                if (name !== 'Unknown') {
                  if (!stationGroups.has(name)) {
                    stationGroups.set(name, { centers: [], props: [] });
                  }
                  stationGroups.get(name).centers.push(center);
                  stationGroups.get(name).props.push(feature.properties);
                } else {
                  unknownStations.push({ center, props: feature.properties });
                }
              }
            }
          });

          const handleStationClick = (e, name, routes, latlng) => {
            const pt = e.containerPoint || (S.map && S.map.latLngToContainerPoint(latlng));
            if (pt && S.overlay && S.overlay.hitAt(pt)) return;

            S.ignoreMapClick = true;
            setTimeout(() => { S.ignoreMapClick = false; }, 50);

            select({ kind: 'station', name: name, routes: routes, la: latlng.lat, lo: latlng.lng });
          };
          
          const stationBgLayer = L.geoJSON(geojson, {
            renderer: stationRenderer,
            interactive: false,
            style: () => ({ color: '#000000', lineCap: 'square' })
          });

          const stationFgLayer = L.geoJSON(geojson, {
            renderer: stationRenderer,
            interactive: true,
            style: () => ({ color: '#ffffff', lineCap: 'square' }),
            onEachFeature: (feature, layer) => {
              layer.on('click', (e) => {
                const name = getStationName(feature.properties);
                let routes = [];
                if (stationGroups.has(name)) {
                  routes = [...new Set(stationGroups.get(name).props.map(p => p.N02_004 || p.N02_003 || p.route_name || p.company || '').filter(Boolean))];
                } else {
                  const r = feature.properties.N02_004 || feature.properties.N02_003 || feature.properties.route_name || feature.properties.company || '';
                  if (r) routes.push(r);
                }
                handleStationClick(e, name, routes, e.latlng);
              });
            }
          });

          const stationDotsLayer = L.layerGroup();
          
          stationGroups.forEach((data, name) => {
            let latSum = 0; let lngSum = 0;
            data.centers.forEach(c => { latSum += c.lat; lngSum += c.lng; });
            const avgCenter = L.latLng(latSum / data.centers.length, lngSum / data.centers.length);
            
            const routes = [...new Set(data.props.map(p => p.N02_004 || p.N02_003 || p.route_name || p.company || '').filter(Boolean))];
            
            L.circleMarker(avgCenter, {
              renderer: stationRenderer,
              interactive: true,
              radius: 4.5,
              color: '#000000',
              weight: 1.5,
              fillColor: '#ffffff',
              fillOpacity: 1
            }).on('click', (e) => {
              handleStationClick(e, name, routes, avgCenter);
            }).addTo(stationDotsLayer);
          });

          unknownStations.forEach(item => {
            const r = item.props.N02_004 || item.props.N02_003 || item.props.route_name || item.props.company || '';
            L.circleMarker(item.center, {
              renderer: stationRenderer, interactive: true, radius: 4.5,
              color: '#000000', weight: 1.5, fillColor: '#ffffff', fillOpacity: 1
            }).on('click', (e) => {
              handleStationClick(e, '不明', r ? [r] : [], item.center);
            }).addTo(stationDotsLayer);
          });

          function updateStationDisplay() {
            const z = S.map.getZoom();
            if (z <= 10) {
              if (!S.map.hasLayer(stationDotsLayer)) S.map.addLayer(stationDotsLayer);
              if (S.map.hasLayer(stationBgLayer)) S.map.removeLayer(stationBgLayer);
              if (S.map.hasLayer(stationFgLayer)) S.map.removeLayer(stationFgLayer);
            } else {
              if (S.map.hasLayer(stationDotsLayer)) S.map.removeLayer(stationDotsLayer);
              if (!S.map.hasLayer(stationBgLayer)) S.map.addLayer(stationBgLayer);
              if (!S.map.hasLayer(stationFgLayer)) S.map.addLayer(stationFgLayer);

              const w = getStationWeights(z);
              stationBgLayer.setStyle({ weight: w.bg, opacity: 1 });
              stationFgLayer.setStyle({ weight: w.fg, opacity: 1 });
            }
          }

          S.map.on('zoomend', updateStationDisplay);
          updateStationDisplay();

        } catch (err) {
          console.error('駅データの取得に失敗:', err);
        }
      }

      function bindControls() {
        document.querySelectorAll('[data-tm-layer]').forEach((btn) => {
          const key = btn.dataset.tmLayer;
          btn.setAttribute('aria-pressed', String(S.on[key]));
          btn.addEventListener('click', () => {
            S.on[key] = !S.on[key];
            btn.setAttribute('aria-pressed', String(S.on[key]));
            savePrefs();
            if (MODES.includes(key)) { updateCounts(); loadVehicles(); }
            else { afterVehicles(); }
          });
        });
      }

      async function init() {
        loadPrefs();
        bindControls();
        loadInfo();
        setInterval(() => { if (!document.hidden) loadInfo(); }, 60 * 1000);

        if (typeof L === 'undefined') {
          showMsg('地図ライブラリ(Leaflet)を読み込めませんでした。', true);
          if ($('tm-updated'))$('tm-updated').textContent = '地図を表示できません';
          return;
        }
        let cfg;
        try { cfg = await api('/api/transit/map/config'); } catch (_) {
          showMsg('地図の設定を取得できませんでした。ページを再読み込みしてください。', true);
          if ($('tm-updated'))$('tm-updated').textContent = '地図を表示できません';
          return;
        }
        S.cfg = cfg;
        
        const tileUrl = cfg.tiles.template.replace('{layer}', 'pale');

        const map = L.map('tm-map', {
          center: [cfg.school.lat, cfg.school.lon], zoom: cfg.view.zoom, minZoom: cfg.view.minZoom, maxZoom: cfg.view.maxZoom,
          zoomAnimation: false,
          preferCanvas: true, // ★軽量化: Leafletのデフォルト描画をすべてCanvasに強制し、重いSVGレイヤーの生成を防止
          attributionControl: true
        });
        S.map = map;
        map.attributionControl.setPrefix(false);
        map.attributionControl.addAttribution('データ: <a href="https://www.odpt.org/" target="_blank" rel="noopener noreferrer">公共交通オープンデータセンター</a>・各交通事業者');
        S.tiles = L.tileLayer(tileUrl, {
          minZoom: cfg.view.minZoom, maxZoom: cfg.view.maxZoom, errorTileUrl: BLANK_TILE, keepBuffer: 2,
          attribution: '地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院(地理院タイル)</a>'
        }).addTo(map);
        L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
        S.overlay = createOverlay(map);

        $('tm-home')?.addEventListener('click', () => map.setView([cfg.school.lat, cfg.school.lon], cfg.view.zoom));

        $('tm-geolocation')?.addEventListener('click', () => {
          if (!navigator.geolocation) {
            showMsg('お使いのブラウザは現在地機能に対応していません。');
            setTimeout(() => showMsg(''), 4000);
            return;
          }
          
          const geoBtn = $('tm-geolocation');
          geoBtn.textContent = '取得中...';
          geoBtn.disabled = true;

          navigator.geolocation.getCurrentPosition(
            (position) => {
              geoBtn.textContent = '現在地へ';
              geoBtn.disabled = false;
              map.setView([position.coords.latitude, position.coords.longitude], 15);
            },
            (error) => {
              geoBtn.textContent = '現在地へ';
              geoBtn.disabled = false;
              showMsg('現在地を取得できませんでした。端末の位置情報設定を確認してください。');
              setTimeout(() => showMsg(''), 5000);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });

        map.on('click', (e) => { 
          const hit = S.overlay.hitAt(e.containerPoint); 
          if (hit) {
            select({ kind: hit.kind, id: hit.id });
          } else if (!S.ignoreMapClick) {
            select(null);
          }
        });
        
        map.on('mousemove', (e) => { map.getContainer().style.cursor = S.overlay.hitAt(e.containerPoint) ? 'pointer' : ''; });
        let moveTimer = 0;
        map.on('moveend zoomend', () => { clearTimeout(moveTimer); moveTimer = setTimeout(() => { loadVehicles(); }, 250); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });
        if (typeof ResizeObserver === 'function') new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(map.getContainer());

        const pollMs = Math.max(15, Math.round((cfg.pollSec || 30) / 2)) * 1000;
        setInterval(() => { if (!document.hidden) loadVehicles(); }, pollMs);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadVehicles(); loadInfo(); } });

        S.overlay.schedule();
        loadVehicles();
        
        loadGeoJsonRoutes();
        loadGeoJsonStations();
      }

      init();
    })();
  </script>
</body>
</html>
