<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通情報 - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    /* ===== 交通マップ (.tm-*) ===== */
    .tm-section { margin-top: 1.25rem; }
    .tm-below { margin-top: 1.25rem; }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; }
    .tm-chipset, .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; cursor: pointer;
    }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip:focus-visible, .tm-btn:focus-visible, .tm-select select:focus-visible, .tm-pop-close:focus-visible {
      outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px;
    }
    .tm-chip[hidden] { display: none; }
    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.rail { background: #2563eb; }
    .tm-dot.bus { background: #f59e0b; }
    .tm-dot.other { background: #7c3aed; }
    .tm-dot.stop { background: #334155; width: .6rem; height: .6rem; }
    .tm-dot.late { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }
    .tm-select { display: inline-block; }
    #map { width: 100%; height: 75vh; min-height: 500px; border-radius: 8px; z-index: 1; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <main class="app-main">
      <header class="app-header">
        <h1>交通情報</h1>
      </header>
      <section class="tm-section">
        <div class="tm-toolbar">
          <div class="tm-chipset">
            <button class="tm-chip" aria-pressed="true" id="toggle-rail">
              <span class="tm-dot rail"></span>鉄道路線
            </button>
          </div>
        </div>
        
        <!-- マップ表示領域 -->
        <div id="map"></div>
        
      </section>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // マップの初期化（日本の中心付近をセット）
      const map = L.map('map').setView([36.2048, 138.2529], 5);

      // 地図タイルの設定（OpenStreetMap）
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      let railLayer;

      // サーバーからGeoJSONデータを取得して描画
      fetch('/api/transit/railroadsection')
        .then(response => {
          if (!response.ok) {
            throw new Error('路線の取得に失敗しました');
          }
          return response.json();
        })
        .then(data => {
          railLayer = L.geoJSON(data, {
            style: function (feature) {
              return {
                color: '#2563eb', // 路線の色
                weight: 2,
                opacity: 0.8
              };
            },
            onEachFeature: function (feature, layer) {
              // プロパティが存在する場合はポップアップに事業者名と路線名を表示
              if (feature.properties) {
                const company = feature.properties.N02_004 || '事業者不明';
                const line = feature.properties.N02_003 || '路線名不明';
                layer.bindPopup(`<b>${company}</b><br>${line}`);
              }
            }
          }).addTo(map);
          
          // データが描画されたら、マップの表示領域をデータ全体の範囲に合わせる
          map.fitBounds(railLayer.getBounds());
        })
        .catch(error => {
          console.error('GeoJSONの読み込みに失敗しました:', error);
        });

      // 路線の表示切り替えボタンの処理
      const toggleRailBtn = document.getElementById('toggle-rail');
      toggleRailBtn.addEventListener('click', () => {
        const isPressed = toggleRailBtn.getAttribute('aria-pressed') === 'true';
        toggleRailBtn.setAttribute('aria-pressed', String(!isPressed));
        if (railLayer) {
          if (isPressed) {
            map.removeLayer(railLayer);
          } else {
            railLayer.addTo(map);
          }
        }
      });
    });
  </script>
</body>
</html>
