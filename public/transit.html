<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道路情報 - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="/assets/css/app.css">

  <style nonce="%%CSP_NONCE%%">
    /* ===== 画面レイアウトの全画面化調整 ===== */
    .app-main {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 1rem;
    }
    .content-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* ===== 交通マップ (.tm-*) ===== */
    .tm-section {
      margin-top: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; flex: none; }
    .tm-chipset, .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; cursor: pointer;
    }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip:focus-visible, .tm-btn:focus-visible, .tm-pop-close:focus-visible {
      outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px;
    }
    .tm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.local { background: #10b981; /* 一般道: 緑 */ }
    .tm-dot.expw { background: #3b82f6; /* 高速道路: 青 */ }
    .tm-dot.closure { background: #fff; border-color: #dc2626; box-shadow: none; /* 通行止め: 赤枠 */ }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }
    .tm-updated { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; }

    .tm-map-wrap {
      position: relative;
      flex: 1;
      height: 100%;
      min-height: 0;
    }
    .tm-map {
      position: relative; isolation: isolate;
      height: 100% !important;
      width: 100%;
      border: 1px solid rgba(127, 127, 127, .32); border-radius: 14px; overflow: hidden; background: #d6dee8;
    }
    html.dark .tm-map { background: #18212c; }
    html.dark .tm-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92) saturate(.8); }
    .tm-map .leaflet-control-attribution { font-size: 11px; }
    
    .tm-msg {
      position: absolute; left: 50%; top: .75rem; transform: translateX(-50%); z-index: 900; max-width: min(92%, 34rem);
      padding: .45rem .9rem; border-radius: 999px; font-size: .82rem; text-align: center;
      color: #fff; background: rgba(15, 23, 42, .86); pointer-events: none;
    }
    .tm-msg[hidden] { display: none; }
    .tm-msg.fatal { border-radius: 12px; pointer-events: auto; background: rgba(153, 27, 27, .92); }

    @media (max-width: 640px) {
      .app-main { padding: .5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .tm-chip, .tm-btn { transition: none; } }
  </style>
</head>
<body>

      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/index" class="sidebar-nav-button" title="ホーム">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        <span class="sidebar-nav-text">ホーム</span>
      </a>
      <!-- ...既存のメニュー群... -->
      <a href="/transit" class="sidebar-nav-button" title="交通情報">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z" /><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 9h16M8 6h.01M16 6h.01M7 21v-3M17 21v-3M8 13h.01M16 13h.01" /></svg>

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />

  <header class="mobile-topbar">
    <a href="/index" class="mobile-brand-name">並木中等教育学校18回生</a>
    <button id="mobile-user-avatar-btn" type="button" aria-label="ユーザーメニュー"><img id="mobile-user-avatar" src="https://via.placeholder.com/32?text=U" alt="Avatar" class="mobile-avatar-image" /></button>

  <main class="app-main">
    <div class="content-area">
      <section class="tm-section" aria-label="道路マップ">
        <div class="tm-toolbar">
          <div class="tm-chipset" role="group" aria-label="地図に表示するもの">
            <button type="button" class="tm-chip" data-tm-layer="local" aria-pressed="true">
              <span class="tm-dot local" aria-hidden="true"></span>一般道 <span class="tm-count" data-tm-count="local"></span>
            </button>
            <button type="button" class="tm-chip" data-tm-layer="expw" aria-pressed="true">
              <span class="tm-dot expw" aria-hidden="true"></span>高速道路 <span class="tm-count" data-tm-count="expw"></span>
            </button>
            <button type="button" class="tm-chip" data-tm-layer="closure" aria-pressed="false">
              <span class="tm-dot closure" aria-hidden="true"></span>通行止め・渋滞のみ
            </button>
          </div>
          <div class="tm-tools">
            <button type="button" class="tm-btn" id="tm-geolocation">現在地へ</button>
            <button type="button" class="tm-btn" id="tm-home">学校の周辺へ</button>
            <span class="tm-updated" id="tm-updated" role="status" aria-live="polite">読み込み中…</span>
          </div>
        </div>

        <div class="tm-map-wrap">
          <div id="tm-map" class="tm-map" role="application" aria-label="道路状況のマップ。"></div>
          <div id="tm-msg" class="tm-msg" role="status" hidden></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script nonce="%%CSP_NONCE%%">
    // 基本的なテーマやプロフィールの読み込み処理（transit.htmlから踏襲）
    // ... （省略せずにtransit.htmlと同様のスクリプトを配置してください） ...
  </script>
  
  <script nonce="%%CSP_NONCE%%">
    // ===== 道路マップ =====
    (() => {
      'use strict';
      const rf = window.fetch.bind(window);
      const $ = (id) => document.getElementById(id);
      
      const MODES = ['local', 'expw'];
      const PREF_KEY = 'namiki-road-map';

      const S = {
        map: null,
        layers: { local: L.layerGroup(), expw: L.layerGroup() },
        on: { local: true, expw: true, closure: false },
        cfg: {
          school: { lat: 36.0683, lon: 140.1256, name: "並木中等教育学校" }, // 実際の座標に置き換えてください
          view: { zoom: 12, minZoom: 9, maxZoom: 18 }
        },
        error: false,
        updatedAt: 0
      };

      const clock = (ms) => (ms ? new Date(ms).toLocaleTimeString('ja-JP', { hour12: false }) : '--:--:--');

      function showMsg(text, fatal) {
        const box = $('tm-msg');
        if (!box) return;
        if (!text) { box.hidden = true; return; }
        box.textContent = text;
        box.classList.toggle('fatal', Boolean(fatal));
        box.hidden = false;
      }

      function loadPrefs() {
        try {
          const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
          Object.keys(S.on).forEach((k) => { if (typeof p.on?.[k] === 'boolean') S.on[k] = p.on[k]; });
        } catch (_) {}
      }

      function savePrefs() {
        try { localStorage.setItem(PREF_KEY, JSON.stringify({ on: S.on })); } catch (_) {}
      }

      // GeoJSONのスタイル設定
      function getRoadStyle(feature, type) {
        const props = feature.properties || {};
        const isClosure = props.status === 'closure' || props.status === 'closed';
        const isTrafficJam = props.status === 'jam' || props.status === 'heavy';
        
        // 渋滞・通行止めのみ表示モードの時のフィルタリング用フラグ処理はレンダリング前に制御
        let color = type === 'expw' ? '#3b82f6' : '#10b981'; // 基本色
        let weight = type === 'expw' ? 6 : 4;
        let opacity = 0.7;

        if (isClosure) {
          color = '#dc2626'; // 赤
          weight = 8;
          opacity = 1.0;
        } else if (isTrafficJam) {
          color = '#f59e0b'; // オレンジ
          weight = 7;
          opacity = 0.9;
        }

        return { color, weight, opacity };
      }

      // 道路データのフェッチと描画
      async function loadRoadData(type) {
        if (!S.map || !S.on[type]) {
          S.layers[type].clearLayers();
          return;
        }

        try {
          // キャッシュバスター等を付与してAPIから取得
          const res = await rf(`/api/road/${type}`, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('HTTP Error: ' + res.status);
          const geojson = await res.json();

          S.layers[type].clearLayers();

          const geoLayer = L.geoJSON(geojson, {
            filter: (feature) => {
              if (!S.on.closure) return true;
              // 渋滞・通行止めモードがONの場合は、該当ステータスのみ表示
              const st = feature.properties?.status;
              return ['closure', 'closed', 'jam', 'heavy'].includes(st);
            },
            style: (feature) => getRoadStyle(feature, type),
            onEachFeature: (feature, layer) => {
              // ツールチップやポップアップの設定
              const props = feature.properties || {};
              const name = props.name || props.road_name || '名称不明';
              const status = props.status || '順調';
              let desc = `<b>${name}</b><br>状況: ${status}`;
              if(props.detail) desc += `<br>詳細: ${props.detail}`;
              
              layer.bindPopup(desc);
            }
          });

          geoLayer.addTo(S.layers[type]);
          
          // 件数の更新
          const countEl = document.querySelector(`[data-tm-count="${type}"]`);
          if (countEl) countEl.textContent = geoLayer.getLayers().length;

          S.error = false;
          S.updatedAt = Date.now();
        } catch (err) {
          console.error(`道路情報(${type})の取得に失敗:`, err);
          S.error = true;
        }
      }

      function updateUI() {
        const status = $('tm-updated');
        if (status) {
          if (S.error) status.textContent = '更新できませんでした。';
          else status.textContent = `最終更新 ${clock(S.updatedAt)}`;
        }
        
        if (S.error) showMsg('道路状況データを取得できませんでした。');
        else if (!S.on.local && !S.on.expw) showMsg('一般道・高速道路の表示がオフです。上のボタンで表示できます。');
        else showMsg('');
      }

      function refreshAllData() {
        Promise.all([
          loadRoadData('local'),
          loadRoadData('expw')
        ]).then(() => updateUI());
      }

      function bindControls() {
        document.querySelectorAll('[data-tm-layer]').forEach((btn) => {
          const key = btn.dataset.tmLayer;
          btn.setAttribute('aria-pressed', String(S.on[key]));
          btn.addEventListener('click', () => {
            S.on[key] = !S.on[key];
            btn.setAttribute('aria-pressed', String(S.on[key]));
            savePrefs();
            
            if (MODES.includes(key)) {
              if (S.on[key]) {
                if (!S.map.hasLayer(S.layers[key])) S.map.addLayer(S.layers[key]);
                loadRoadData(key).then(() => updateUI());
              } else {
                if (S.map.hasLayer(S.layers[key])) S.map.removeLayer(S.layers[key]);
                updateUI();
              }
            } else if (key === 'closure') {
              // フィルタリング条件の変更のため全体を再描画
              refreshAllData();
            }
          });
        });
      }

      function initMap() {
        loadPrefs();
        
        const map = L.map('tm-map', {
          center: [S.cfg.school.lat, S.cfg.school.lon],
          zoom: S.cfg.view.zoom,
          minZoom: S.cfg.view.minZoom,
          maxZoom: S.cfg.view.maxZoom,
          zoomAnimation: false,
          attributionControl: true
        });
        S.map = map;
        
        map.attributionControl.setPrefix(false);
        map.attributionControl.addAttribution('データ: <a href="https://www.jartic.or.jp/" target="_blank" rel="noopener noreferrer">JARTIC</a>(推測) 等');

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
          minZoom: S.cfg.view.minZoom,
          maxZoom: S.cfg.view.maxZoom,
          attribution: '地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院(地理院タイル)</a>'
        }).addTo(map);

        L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

        // 初期状態でONになっているレイヤーをマップに追加
        if (S.on.local) map.addLayer(S.layers.local);
        if (S.on.expw) map.addLayer(S.layers.expw);

        $('tm-home')?.addEventListener('click', () => map.setView([S.cfg.school.lat, S.cfg.school.lon], S.cfg.view.zoom));$('tm-geolocation')?.addEventListener('click', () => {
          if (!navigator.geolocation) {
            showMsg('お使いのブラウザは現在地機能に対応していません。');
            setTimeout(() => showMsg(''), 4000);
            return;
          }
          const geoBtn = $('tm-geolocation');
          geoBtn.textContent = '取得中...';
          geoBtn.disabled = true;

          navigator.geolocation.getCurrentPosition(
            (position) => {
              geoBtn.textContent = '現在地へ';
              geoBtn.disabled = false;
              map.setView([position.coords.latitude, position.coords.longitude], 14);
            },
            (error) => {
              geoBtn.textContent = '現在地へ';
              geoBtn.disabled = false;
              showMsg('現在地を取得できませんでした。');
              setTimeout(() => showMsg(''), 5000);
            }
          );
        });

        bindControls();
        refreshAllData();
        
        // 5分(300秒)おきに自動更新
        setInterval(() => { if (!document.hidden) refreshAllData(); }, 300000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAllData(); });
      }

      // DOMロードまたは準備完了時に初期化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMap);
      } else {
        initMap();
      }

    })();
  </script>
</body>
</html>
