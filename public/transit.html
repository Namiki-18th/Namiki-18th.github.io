<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通情報 - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    .tm-section { margin-top: 1.25rem; }
    .tm-below { margin-top: 1.25rem; }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; }
    .tm-chipset, .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; cursor: pointer;
    }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip:focus-visible, .tm-btn:focus-visible, .tm-select select:focus-visible, .tm-pop-close:focus-visible {
      outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px;
    }
    .tm-chip[hidden] { display: none; }
    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.rail { background: #2563eb; }
    .tm-dot.bus { background: #f59e0b; }
    .tm-dot.other { background: #7c3aed; }
    .tm-dot.stop { background: #334155; width: .6rem; height: .6rem; }
    .tm-dot.late { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }
    .tm-select { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; }
    .tm-select select {
      min-height: 36px; padding: .3rem .6rem; border: 1px solid rgba(127, 127, 127, .38); border-radius: 8px;
      background: transparent; color: inherit; font: inherit; font-size: .85rem;
    }
    .tm-select select option { color: #111; background: #fff; }
    .tm-updated { font-size: .8rem; opacity: .75; font-variant-numeric: tabular-nums; }

    .tm-map-wrap { position: relative; }
    .tm-map {
      position: relative; isolation: isolate; 
      height: clamp(420px, 66vh, 780px); height: clamp(420px, 66dvh, 780px);
      border: 1px solid rgba(127, 127, 127, .32); border-radius: 14px; overflow: hidden; background: #d6dee8;
    }
    html.dark .tm-map { background: #18212c; }
    html.dark .tm-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92) saturate(.8); }
    .tm-map .leaflet-control-attribution { font-size: 11px; }
    .tm-canvas { position: absolute; left: 0; top: 0; z-index: 450; pointer-events: none; }
    .tm-msg {
      position: absolute; left: 50%; top: .75rem; transform: translateX(-50%); z-index: 900; max-width: min(92%, 34rem);
      padding: .45rem .9rem; border-radius: 999px; font-size: .82rem; text-align: center;
      color: #fff; background: rgba(15, 23, 42, .86); pointer-events: none;
    }
    .tm-msg[hidden] { display: none; }
    .tm-msg.fatal { border-radius: 12px; pointer-events: auto; background: rgba(153, 27, 27, .92); }

    .tm-pop {
      position: absolute; z-index: 460; width: 17rem; max-width: calc(100% - 16px); padding: .7rem .8rem .6rem;
      border-radius: 12px; color: #1e293b; background: #fff; box-shadow: 0 6px 22px rgba(0, 0, 0, .3);
      font-size: .82rem; line-height: 1.45;
    }
    .tm-pop[hidden] { display: none; }
    .tm-pop-title { display: flex; align-items: center; gap: .45rem; margin: 0 1.6rem .4rem 0; font-weight: 700; font-size: .92rem; }
    .tm-pop-close {
      position: absolute; right: .35rem; top: .3rem; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: transparent; color: #475569; font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    
    /* 時刻表用のスタイル追加 */
    .timetable-box { margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
    .timetable-dir { font-weight: 600; color: #334155; margin-bottom: 4px; font-size: 0.8rem; }
    .timetable-train { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; background: #f8fafc; border-radius: 6px; margin-bottom: 4px; }
    .train-time { font-weight: 700; color: #0f172a; font-size: 0.9rem; }
    .train-info { font-size: 0.75rem; color: #475569; }
    .train-number { display: inline-block; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-family: monospace; }
    
    .page-header, .tm-below, #transit-error, .tm-info { display: none !important; }
    .app-main, .content-area { padding: 0 !important; margin: 0 !important; max-width: 100% !important; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .tm-section { margin: 0 !important; flex: 1; display: flex; position: relative; }
    .tm-map-wrap { flex: 1; width: 100%; position: relative; }
    .tm-map { height: 100% !important; width: 100%; border: none; border-radius: 0; }
    .tm-toolbar {
      position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000;
      background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); margin: 0; backdrop-filter: blur(4px);
    }
    html.dark .tm-toolbar { background: rgba(24, 33, 44, 0.9); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header" data-href="/index">
      <div class="flex items-center gap-3">
        <div class="logo-badge"><img src="/logo.webp" alt="Logo" class="logo-badge-img"></div>
        <h1 class="font-bold text-sm sidebar-brand-text">並木中等教育学校18回生<br><span class="text-xs font-normal sidebar-brand-tagline">ダッシュボード</span></h1>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/index" class="sidebar-nav-button" title="ホーム"><span class="sidebar-nav-text">ホーム</span></a>
      <a href="/transit" class="sidebar-nav-button active" title="交通情報"><span class="sidebar-nav-text">交通情報</span></a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="content-area">
      <section class="tm-section" aria-label="交通マップ">
        <div class="tm-toolbar">
          <div class="tm-chipset" role="group">
            <button type="button" class="tm-chip" data-tm-layer="rail" aria-pressed="true"><span class="tm-dot rail" aria-hidden="true"></span>列車</button>
            <button type="button" class="tm-chip" data-tm-layer="stops" aria-pressed="true"><span class="tm-dot stop" aria-hidden="true"></span>駅</button>
          </div>
          <div class="tm-tools">
            <button type="button" class="tm-btn" id="tm-home">学校周辺</button>
            <span class="tm-updated" id="tm-updated">読み込み中…</span>
          </div>
        </div>

        <div class="tm-map-wrap">
          <div id="tm-map" class="tm-map"></div>
          <div id="tm-msg" class="tm-msg" hidden></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Leaflet JS のロード -->
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 地図の初期化 (つくば周辺を中心に設定)
      const map = L.map('tm-map', { zoomControl: false }).setView([36.0825, 140.1114], 12);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // 地図タイルの読み込み (APIを経由する場合はURLを適宜変更してください)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // 学校周辺へ戻るボタン
      document.getElementById('tm-home').addEventListener('click', () => {
        map.setView([36.0825, 140.1114], 13);
      });

      // アイコン定義
      const stationIcon = L.divIcon({
        className: 'tm-station-icon',
        html: '<div class="tm-dot stop" style="width:12px; height:12px;"></div>',
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });

      // 時刻表を取得してHTMLを生成する関数
      async function loadTimetable(stationId) {
        try {
          const res = await fetch(`/api/transit/timetable?station=${encodeURIComponent(stationId)}`);
          if (!res.ok) throw new Error('API Error');
          const data = await res.json();
          
          let html = '';
          const directions = {
            'odpt.RailDirection:Outbound': '下り (つくば方面)',
            'odpt.RailDirection:Inbound': '上り (秋葉原方面)'
          };

          for (const [dirKey, label] of Object.entries(directions)) {
            if (data[dirKey] && data[dirKey].length > 0) {
              html += `<div class="timetable-box"><div class="timetable-dir">${label}</div>`;
              data[dirKey].forEach(train => {
                const trainNum = train['odpt:trainNumber'] || '----';
                // 目的地をパースして表示
                const destRaw = train['odpt:destinationStation']?.[0] || '';
                const dest = destRaw.split('.').pop() || '不明';

                html += `
                  <div class="timetable-train">
                    <div class="train-time">${train['odpt:departureTime']} 発</div>
                    <div class="train-info">行先: ${dest} <span class="train-number" data-train-num="${trainNum}">#${trainNum}</span></div>
                  </div>
                `;
              });
              html += `</div>`;
            }
          }
          return html || '<div class="timetable-box">直近の列車はありません。</div>';
        } catch (error) {
          console.error(error);
          return '<div class="timetable-box text-red">時刻表を取得できませんでした。</div>';
        }
      }

      // TXの駅を地図に描画 (例としてつくば駅と秋葉原駅。実運用時は transit-map.js 等から取得してください)
      const stations = [
        { id: 'odpt.Station:MIR.TsukubaExpress.Tsukuba', name: 'つくば駅', lat: 36.0825, lng: 140.1114 },
        { id: 'odpt.Station:MIR.TsukubaExpress.Moriya', name: '守谷駅', lat: 35.9497, lng: 139.9916 },
        { id: 'odpt.Station:MIR.TsukubaExpress.Akihabara', name: '秋葉原駅', lat: 35.6983, lng: 139.7731 }
      ];

      stations.forEach(st => {
        const marker = L.marker([st.lat, st.lng], { icon: stationIcon }).addTo(map);
        
        // ポップアップの設定
        marker.bindPopup(`<b>${st.name}</b><div id="timetable-${st.id.replace(/[^a-zA-Z0-9]/g, '')}">読み込み中...</div>`, {
          maxWidth: 300,
          minWidth: 240
        });

        // クリック時に時刻表をフェッチして挿入
        marker.on('click', async () => {
          const contentId = `timetable-${st.id.replace(/[^a-zA-Z0-9]/g, '')}`;
          const contentEl = document.getElementById(contentId);
          if (contentEl) {
            contentEl.innerHTML = '<div style="text-align:center; padding: 10px;">時刻表を取得中...</div>';
            contentEl.innerHTML = await loadTimetable(st.id);
          }
        });
      });

      document.getElementById('tm-updated').innerText = '最新情報を反映しました';
    });
  </script>
</body>
</html>
