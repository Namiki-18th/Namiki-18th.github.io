  <style nonce="%%CSP_NONCE%%">
    .app-main{height:100vh;display:flex;flex-direction:column;box-sizing:border-box;padding:1rem;padding-top:calc(1rem + var(--tm-bar-clear,0px))}
    @supports(height:100dvh){.app-main{height:var(--tm-main-h,100dvh)}}
    .content-area{height:100%;display:flex;flex-direction:column;max-width:100%;margin:0;padding:0}
    .tm-section{margin-top:0;flex:1;display:flex;flex-direction:column;min-height:0}
    .tm-toolbar{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;justify-content:space-between;margin-bottom:.65rem;flex:none}
    .tm-chipset{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;min-width:0}
    .tm-group{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
    .tm-sep{flex:none;width:1px;align-self:stretch;min-height:22px;background:rgba(127,127,127,.38)}
    .tm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
    .tm-chip,.tm-btn{display:inline-flex;align-items:center;gap:.4rem;min-height:36px;padding:.35rem .8rem;border:1px solid rgba(127,127,127,.38);border-radius:999px;background:transparent;color:inherit;font:inherit;font-size:.85rem;line-height:1.2;white-space:nowrap;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,opacity .15s ease;-webkit-tap-highlight-color:transparent}
    .tm-chip:hover,.tm-btn:hover:not(:disabled){background:rgba(127,127,127,.14)}
    .tm-chip[aria-pressed="true"]{background:rgba(59,130,246,.16);border-color:var(--color-accent-blue,#3b82f6)}
    .tm-chip[aria-pressed="true"]:hover{background:rgba(59,130,246,.26)}
    .tm-chip[aria-pressed="false"]{opacity:.62}
    .tm-chip[aria-pressed="false"]:hover{opacity:.92}
    .tm-chip:focus-visible,.tm-btn:focus-visible,.tm-pop-close:focus-visible,.tm-msg-btn:focus-visible{outline:2px solid var(--color-accent-blue-light,#60a5fa);outline-offset:2px}
    .tm-chip[hidden]{display:none}
    .tm-btn:disabled{opacity:.5;cursor:not-allowed}
    .tm-btn svg{width:1rem;height:1rem;flex:none}
    @media(pointer:coarse){.tm-chip,.tm-btn{min-height:44px}}
    .tm-dot{width:.8rem;height:.8rem;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);flex:none}

    .tm-dot.late{background:#fff;border-color:#dc2626;box-shadow:none}
    .tm-dot.local{background:#10b981}
    .tm-dot.expw{background:#3b82f6}
    .tm-dot.closure{background:#fff;border-color:#dc2626;box-shadow:none}
    .tm-count{font-variant-numeric:tabular-nums;opacity:.8}
    .tm-updated{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;opacity:.85;font-variant-numeric:tabular-nums}

    .tm-updated[data-state="stale"]::before{background:#f59e0b;opacity:1}
    .tm-updated[data-state="error"]::before{background:#dc2626;opacity:1}

    .tm-canvas{position:absolute;left:0;top:0;z-index:450;pointer-events:none}
    .tm-msg{position:absolute;left:50%;top:.75rem;transform:translateX(-50%);z-index:900;max-width:min(92%,34rem);padding:.45rem .9rem;border-radius:999px;font-size:.82rem;text-align:center;color:#fff;background:rgba(15,23,42,.86);pointer-events:none}

    .tm-pop{position:absolute;z-index:460;width:15.5rem;max-width:calc(100% - 16px);padding:.7rem .8rem .6rem;border-radius:12px;color:var(--tm-pop-fg);background:var(--tm-pop-bg);border:1px solid rgba(127,127,127,.25);box-shadow:0 6px 22px rgba(0,0,0,.3);font-size:.82rem;line-height:1.45}

    .tm-pop-list dd{margin:0;word-break:break-word}
    .tm-pop-late{color:var(--tm-pop-late);font-weight:700}
    .tm-pop-early{color:var(--tm-pop-early)}

      .tm-chipset::-webkit-scrollbar{display:none}
      .tm-group{flex-wrap:nowrap}
      .tm-chip{flex:none}

    }
    @media(prefers-reduced-motion:reduce){
      .tm-chip,.tm-btn{transition:none}

    path.road-alert-blink{animation:roadAlertBlink 2s infinite;pointer-events:stroke!important;cursor:pointer}

  <script nonce="%%CSP_NONCE%%">
    const rf = window.fetch.bind(window);
    const $ = id => document.getElementById(id);
    const $$ = sel => document.querySelector(sel);
    const $$$ = sel => document.querySelectorAll(sel);
    let aInit = 'U';
    const aFB = n => {
      const c = /[&<>"']/.test((n||'').trim()[0]||'U') ? 'U' : ((n||'').trim()[0]||'U');
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#3b82f6"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="18" fill="#fff">${c}</text></svg>`);
    };
    const tglTh = () => {
      const h = document.documentElement, d = h.classList.contains('dark');
      h.classList.toggle('dark', !d); h.classList.toggle('light', d);
      localStorage.setItem('namiki-theme', d ? 'light' : 'dark');
      if($('theme-toggle-switch'))$('theme-toggle-switch').classList.toggle('on', !d);
    };
    const loadProf = async () => {
      const r = await rf('/api/profile');
      if(r.status === 401){ window.location.href='/login'; return; }
      if(!r.ok) return;
      const p = await r.json();
      $('sidebar-user-id').textContent = (p.id && p.id !== 'Unknown') ? p.id : '未設定';
      $('sidebar-user-name').textContent =$('popup-user-name').textContent = p.name || 'ユーザー';
      $('popup-user-email').textContent = p.email || '未設定';
      aInit = p.name || 'U';
      const a = (p.picture && p.picture !== 'admin.png') ? p.picture : aFB(aInit);
      ['sidebar-user-avatar','popup-user-avatar','mobile-user-avatar'].forEach(i => { if($(i))$(i).src = a; });
    };
    if($('theme-toggle-switch'))$('theme-toggle-switch').classList.toggle('on', document.documentElement.classList.contains('dark'));
    ['sidebar-user-avatar','popup-user-avatar','mobile-user-avatar'].forEach(i => {
      const g = $(i); if(!g) return;
      g.src = aFB(aInit);
      g.addEventListener('error', () => { if(!g.dataset.fb){ g.dataset.fb='1'; g.src = aFB(aInit); } });
    });
    loadProf().catch(()=>{});
    $('btn-admin-settings')?.addEventListener('click', () => location.href='/admin');
    $('btn-personal-settings')?.addEventListener('click', () => location.href='/setting');$('btn-toggle-theme-popup')?.addEventListener('click', tglTh);
    document.addEventListener('click', e => {
      const am = $('account-popup-menu'), mm =$('mobile-account-popup-menu');
      if(e.target.closest('#sidebar-user-toggle')){ e.stopPropagation(); am?.classList.toggle('show'); }
      else if(e.target.closest('#mobile-user-avatar-btn')){
        e.stopPropagation(); mm?.classList.toggle('show');
        if(mm) mm.style.display = mm.classList.contains('show') ? 'block' : 'none';
      } else { am?.classList.remove('show'); mm?.classList.remove('show'); }
    });
  </script>
