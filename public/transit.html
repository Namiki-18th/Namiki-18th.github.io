<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通情報 - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header" data-href="/index">
      <div class="flex items-center gap-3">
        <div class="logo-badge"><img src="/logo.webp" alt="Logo" class="logo-badge-img"></div>
        <h1 class="font-bold text-sm sidebar-brand-text">並木中等教育学校18回生<br><span class="text-xs font-normal sidebar-brand-tagline">ダッシュボード</span></h1>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/index" class="sidebar-nav-button" title="ホーム"><span class="icon-nav" aria-hidden="true">⌂</span><span class="sidebar-nav-text">ホーム</span></a>
      <a href="/schedule" class="sidebar-nav-button" title="時間割"><span class="icon-nav" aria-hidden="true">◷</span><span class="sidebar-nav-text">時間割</span></a>
      <a href="/notice" class="sidebar-nav-button" title="お知らせ"><span class="icon-nav" aria-hidden="true">!</span><span class="sidebar-nav-text">お知らせ</span></a>
      <a href="/link" class="sidebar-nav-button" title="リンク"><span class="icon-nav" aria-hidden="true">↗</span><span class="sidebar-nav-text">リンク</span></a>
      <a href="/calendar" class="sidebar-nav-button" title="カレンダー"><span class="icon-nav" aria-hidden="true">□</span><span class="sidebar-nav-text">カレンダー</span></a>
      <a href="/classroom" class="sidebar-nav-button" title="Classroom"><span class="icon-nav" aria-hidden="true">▣</span><span class="sidebar-nav-text">Classroom</span></a>
      <a href="/transit" class="sidebar-nav-button active" title="交通情報"><svg class="icon-nav transit-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16h14l-1-6H6l-1 6Z"></path><path d="M7 10 8.5 6h7L17 10M7 19h.01M17 19h.01M5 16v3m14-3v3"></path></svg><span class="sidebar-nav-text">交通情報</span></a>
    </nav>
    <div class="sidebar-footer">
      <div id="account-popup-menu" class="account-popup-menu">
        <div class="user-info-header popup-header-spacing"><span id="popup-user-name" class="popup-name-text">読み込み中...</span><span id="popup-user-email" class="popup-email-text">読み込み中...</span></div>
        <a href="/setting" class="account-popup-item">設定</a>
        <a href="/logout" class="account-popup-item text-red">ログアウト</a>
      </div>
      <div id="sidebar-user-toggle" class="sidebar-user-row" title="ユーザーメニュー">
        <div class="sidebar-avatar-image" aria-hidden="true"></div>
        <div class="sidebar-user-info"><span class="sidebar-user-name-text">アカウント</span><span class="sidebar-user-id-text">メニュー</span></div>
      </div>
    </div>
  </aside>
  <header class="mobile-topbar">
    <a href="/index" class="mobile-brand-name">並木中等教育学校18回生</a>
    <button id="mobile-user-avatar-btn" type="button" aria-label="ユーザーメニュー">●</button>
    <div id="mobile-account-popup-menu" class="account-popup-menu">
      <a href="/setting" class="account-popup-item">設定</a>
      <a href="/logout" class="account-popup-item text-red">ログアウト</a>
    </div>
  </header>
  <main class="app-main">
    <div class="content-area">
      <header class="page-header">
        <p class="text-sm-muted">通学に役立つ最新情報</p>
        <h1>交通情報</h1>
        <p class="content-card-subtitle">鉄道や道路の状況をまとめて確認できます。</p>
      </header>

      <section class="transit-grid" aria-label="交通情報一覧">
        <article class="transit-card" data-transit-card="jr">
          <div class="transit-header">
            <h2 class="transit-name">JR常磐線</h2>
            <span class="transit-status" data-transit-status>取得中</span>
          </div>
          <p class="transit-body" data-transit-detail>最新の情報を取得しています...</p>
        </article>
        <article class="transit-card" data-transit-card="tx">
          <div class="transit-header">
            <h2 class="transit-name">つくばエクスプレス</h2>
            <span class="transit-status" data-transit-status>取得中</span>
          </div>
          <p class="transit-body" data-transit-detail>最新の情報を取得しています...</p>
        </article>
        <article class="transit-card" data-transit-card="road">
          <div class="transit-header">
            <h2 class="transit-name">道路交通情報</h2>
            <span class="transit-status" data-transit-status>取得中</span>
          </div>
          <p class="transit-body" data-transit-detail>最新の情報を取得しています...</p>
        </article>
      </section>

      <p id="transit-error" class="placeholder-text" hidden>交通情報を取得できませんでした。時間をおいて再度お試しください。</p>
    </div>
  </main>

  <script nonce="%%CSP_NONCE%%">
    const transitSources = [
      { key: 'jr', url: '/api/transit', dataKey: 'jr' },
      { key: 'tx', url: '/api/transit', dataKey: 'tx' },
      { key: 'road', url: '/api/road', dataKey: null }
    ];

    async function loadTransitSource(source) {
      const response = await fetch(source.url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      const data = source.dataKey ? payload[source.dataKey] : payload;
      const card = document.querySelector(`[data-transit-card="${source.key}"]`);
      if (!card || !data) return;
      card.querySelector('[data-transit-status]').textContent = data.status || '情報なし';
      card.querySelector('[data-transit-detail]').textContent = data.detail || '詳細情報はありません。';
      card.dataset.transitTrouble = data.isTrouble ? 'true' : 'false';
    }

    Promise.allSettled(transitSources.map(loadTransitSource)).then((results) => {
      if (results.every((result) => result.status === 'rejected')) {
        document.getElementById('transit-error').hidden = false;
      }
    });

    document.addEventListener('click', (event) => {
      if (event.target.closest('#sidebar-user-toggle')) {
        event.stopPropagation();
        document.getElementById('account-popup-menu')?.classList.toggle('show');
      }
      if (event.target.closest('#mobile-user-avatar-btn')) {
        event.stopPropagation();
        const menu = document.getElementById('mobile-account-popup-menu');
        menu?.classList.toggle('show');
        if (menu) menu.style.display = menu.classList.contains('show') ? 'block' : 'none';
      }
    });
  </script>
</body>
</html>
