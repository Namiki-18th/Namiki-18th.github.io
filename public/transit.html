<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通情報 - 並木中等教育学校18回生</title>
  <script nonce="%%CSP_NONCE%%">
    // 保存済みのテーマ設定を描画前に反映する(反映しないと、ライト設定でもページを開くたびにダークで表示されてしまう)
    try {
      var savedTheme = localStorage.getItem('namiki-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        document.documentElement.classList.toggle('light', savedTheme === 'light');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style nonce="%%CSP_NONCE%%">
    /* CSS崩れの補正・インライン調整 (index共通) */
    .user-info-header { display: flex; align-items: center; gap: 0.75rem; }
    .popup-user-avatar { width: 2.25rem; height: 2.25rem; border-radius: 9999px; object-fit: cover; border: 1px solid var(--color-border, #e2e8f0); flex-shrink: 0; }
    html.dark .popup-user-avatar { border-color: var(--color-border, #334155); }
    .user-info-text { flex: 1; min-width: 0; }
    .sidebar-avatar-image, .mobile-avatar-image { object-fit: cover; border-radius: 9999px; }

    .cursor-pointer { cursor: pointer; }
    .u-hidden { display: none; }
    .mt-quarter-rem { margin-top: 0.25rem; }

    .sidebar-nav-button,
    .mobile-brand-name,
    .account-popup-item {
      background: transparent;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .sidebar-nav-button {
      text-align: left;
      width: 100%;
    }
    .account-popup-item {
      text-align: left;
      width: 100%;
    }
    .mobile-brand-name {
      padding: 0;
    }

    /* ===== 画面レイアウトの全画面化調整 ===== */
    .app-main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 1rem;
      /* モバイルの固定トップバーと重なる場合は、JS(fitLayout)が --tm-bar-clear で避ける分を足す */
      padding-top: calc(1rem + var(--tm-bar-clear, 0px));
    }
    @supports (height: 100dvh) {
      .app-main { height: var(--tm-main-h, 100dvh); }
    }
    .content-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* ===== 交通マップ (.tm-*) ===== */
    .tm-section {
      margin-top: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tm-toolbar { display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; justify-content: space-between; margin-bottom: .65rem; flex: none; }
    .tm-chipset { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .7rem; min-width: 0; }
    .tm-group { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .tm-sep { flex: none; width: 1px; align-self: stretch; min-height: 22px; background: rgba(127, 127, 127, .38); }
    .tm-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }

    .tm-chip, .tm-btn {
      display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .8rem;
      border: 1px solid rgba(127, 127, 127, .38); border-radius: 999px; background: transparent; color: inherit;
      font: inherit; font-size: .85rem; line-height: 1.2; white-space: nowrap; cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tm-chip:hover, .tm-btn:hover:not(:disabled) { background: rgba(127, 127, 127, .14); }
    .tm-chip[aria-pressed="true"] { background: rgba(59, 130, 246, .16); border-color: var(--color-accent-blue, #3b82f6); }
    .tm-chip[aria-pressed="true"]:hover { background: rgba(59, 130, 246, .26); }
    .tm-chip[aria-pressed="false"] { opacity: .62; }
    .tm-chip[aria-pressed="false"]:hover { opacity: .92; }
    .tm-chip:focus-visible, .tm-btn:focus-visible, .tm-pop-close:focus-visible, .tm-msg-btn:focus-visible {
      outline: 2px solid var(--color-accent-blue-light, #60a5fa); outline-offset: 2px;
    }
    .tm-chip[hidden] { display: none; }
    .tm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tm-btn svg { width: 1rem; height: 1rem; flex: none; }
    @media (pointer: coarse) { .tm-chip, .tm-btn { min-height: 44px; } }

    .tm-dot { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); flex: none; }
    .tm-dot.rail { background: #2563eb; }
    .tm-dot.bus { background: #f59e0b; }
    .tm-dot.other { background: #7c3aed; }
    .tm-dot.late { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-dot.local { background: #10b981; }
    .tm-dot.expw { background: #3b82f6; }
    .tm-dot.closure { background: #fff; border-color: #dc2626; box-shadow: none; }
    .tm-count { font-variant-numeric: tabular-nums; opacity: .8; }

    /* 更新状況(色の点で 正常 / 古い / 失敗 が分かる) */
    .tm-updated { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; opacity: .85; font-variant-numeric: tabular-nums; }
    .tm-updated::before { content: ""; flex: none; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; opacity: .45; }
    .tm-updated[data-state="ok"]::before { background: #10b981; opacity: 1; }
    .tm-updated[data-state="stale"]::before { background: #f59e0b; opacity: 1; }
    .tm-updated[data-state="error"]::before { background: #dc2626; opacity: 1; }

    .tm-map-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
    }
    /* 親の高さに左右されず常に枠いっぱいに広がるよう絶対配置にする */
    .tm-map {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; isolation: isolate; box-sizing: border-box;
      height: 100% !important;
      border: 1px solid rgba(127, 127, 127, .32); border-radius: 14px; overflow: hidden; background: #d6dee8;
      --tm-pop-bg: #fff; --tm-pop-fg: #1e293b; --tm-pop-sub: #64748b; --tm-pop-late: #b91c1c; --tm-pop-early: #047857;
    }
    html.dark .tm-map {
      background: #18212c;
      --tm-pop-bg: #1e293b; --tm-pop-fg: #e2e8f0; --tm-pop-sub: #94a3b8; --tm-pop-late: #fca5a5; --tm-pop-early: #6ee7b7;
    }
    html.dark .tm-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92) saturate(.8); }
    .tm-map .leaflet-control-attribution { font-size: 11px; }
    .tm-canvas { position: absolute; left: 0; top: 0; z-index: 450; pointer-events: none; }
    .tm-msg {
      position: absolute; left: 50%; top: .75rem; transform: translateX(-50%); z-index: 900; max-width: min(92%, 34rem);
      padding: .45rem .9rem; border-radius: 999px; font-size: .82rem; text-align: center;
      color: #fff; background: rgba(15, 23, 42, .86); pointer-events: none;
    }
    .tm-msg[hidden] { display: none; }
    .tm-msg.fatal { border-radius: 12px; pointer-events: auto; background: rgba(153, 27, 27, .92); }
    .tm-msg-btn {
      margin-left: .6rem; padding: .15rem .75rem; border: 1px solid rgba(255, 255, 255, .7); border-radius: 999px;
      background: transparent; color: inherit; font: inherit; cursor: pointer;
    }
    .tm-msg-btn:hover { background: rgba(255, 255, 255, .18); }

    /* 車両・駅・学校のポップアップ */
    .tm-pop {
      position: absolute; z-index: 460; width: 15.5rem; max-width: calc(100% - 16px); padding: .7rem .8rem .6rem;
      border-radius: 12px; color: var(--tm-pop-fg); background: var(--tm-pop-bg);
      border: 1px solid rgba(127, 127, 127, .25); box-shadow: 0 6px 22px rgba(0, 0, 0, .3);
      font-size: .82rem; line-height: 1.45;
    }
    .tm-pop[hidden] { display: none; }
    .tm-pop-title { display: flex; align-items: center; gap: .45rem; margin: 0 1.6rem .4rem 0; font-weight: 700; font-size: .92rem; }
    .tm-pop-close {
      position: absolute; right: .35rem; top: .3rem; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: transparent; color: var(--tm-pop-sub); font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    .tm-pop-close:hover { background: rgba(127, 127, 127, .2); }
    .tm-pop-list { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .7rem; margin: 0; }
    .tm-pop-list dt { color: var(--tm-pop-sub); }
    .tm-pop-list dd { margin: 0; word-break: break-word; }
    .tm-pop-late { color: var(--tm-pop-late); font-weight: 700; }
    .tm-pop-early { color: var(--tm-pop-early); }

    /* 道路のポップアップ (Leaflet標準ポップアップをテーマに合わせる) */
    .tm-road-pop .leaflet-popup-content-wrapper,
    .tm-road-pop .leaflet-popup-tip { background: var(--tm-pop-bg); color: var(--tm-pop-fg); }
    .tm-road-pop .leaflet-popup-close-button { color: var(--tm-pop-sub); }
    .tm-road-body { margin: .1rem 0; padding-left: .6rem; border-left: 4px solid #10b981; font-size: .85rem; line-height: 1.55; }
    .tm-road-body.is-closure { border-left-color: #dc2626; }
    .tm-road-body.is-jam { border-left-color: #f59e0b; }

    /* Leaflet標準コントロールのダークテーマ対応 */
    html.dark .tm-map .leaflet-bar a { background-color: #1e293b; color: #e2e8f0; border-bottom-color: #334155; }
    html.dark .tm-map .leaflet-bar a:hover { background-color: #334155; }
    html.dark .tm-map .leaflet-bar a.leaflet-disabled { background-color: #1e293b; color: #64748b; }
    html.dark .tm-map .leaflet-control-attribution { background: rgba(15, 23, 42, .78); color: #cbd5e1; }
    html.dark .tm-map .leaflet-control-attribution a { color: #93c5fd; }
    html.dark .tm-map .leaflet-control-scale-line { background: rgba(15, 23, 42, .7); color: #e2e8f0; border-color: #94a3b8; }

    @media (max-width: 640px) {
      .tm-pop { width: 14rem; }
      .app-main { padding: .5rem; padding-top: calc(.5rem + var(--tm-bar-clear, 0px)); }
      /* 絞り込みボタンは横スクロールにして、地図の面積を確保する */
      .tm-toolbar { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: .4rem; }
      .tm-chipset {
        flex-wrap: nowrap; overflow-x: auto; padding-right: 1.5rem; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 1.5rem), transparent);
        mask-image: linear-gradient(to right, #000 calc(100% - 1.5rem), transparent);
      }
      .tm-chipset::-webkit-scrollbar { display: none; }
      .tm-group { flex-wrap: nowrap; }
      .tm-chip { flex: none; }
      .tm-tools { justify-content: space-between; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tm-chip, .tm-btn { transition: none; }
      /* 動きを減らす設定のときは点滅させず、常時表示にする */
      path.road-alert-blink { animation: none !important; }
    }
    /* 渋滞・通行止め道路の点滅アニメーション (1秒点灯・1秒消灯) */
    @keyframes roadAlertBlink {
      0%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    path.road-alert-blink {
      animation: roadAlertBlink 2s infinite;
      /* 消えている時でも線をクリック(タップ)できるようにする */
      pointer-events: stroke !important;
      cursor: pointer;
    }

    /* モバイル向け共通レイアウト */
    @media (max-width: 767px) {
      .sidebar { display: none !important; }
      .mobile-topbar { display: flex !important; position: sticky; top: 0; z-index: 50; }
      
      /* 下部タブバーを横スクロール可能にして全機能へアクセス可能に */
      .mobile-tab-bar { 
        display: flex !important; 
        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100%; 
        z-index: 50; 
        overflow-x: auto;
        white-space: nowrap;
        justify-content: flex-start;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        background-color: var(--bg-card, #ffffff);
        border-top: 1px solid var(--color-border, rgba(127, 127, 127, 0.25));
      }
      html.dark .mobile-tab-bar {
        background-color: var(--bg-card, #1f2937);
      }
      .mobile-tab-bar::-webkit-scrollbar {
        display: none; 
      }
      .mobile-nav-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0.5rem 1rem;
        color: var(--color-text-secondary, #64748b);
        text-decoration: none;
        background: transparent;
        border: none;
        cursor: pointer;
        gap: 0.25rem;
        min-width: 4.5rem;
      }
      html.dark .mobile-nav-button {
        color: var(--color-text-secondary, #94a3b8);
      }
      .mobile-nav-button.active {
        color: var(--color-accent-blue, #3b82f6);
      }
      .mobile-nav-button svg {
        width: 1.5rem;
        height: 1.5rem;
      }
      .mobile-nav-text {
        font-size: 0.65rem;
      }

      .app-main { 
        padding-bottom: 70px !important; 
      }

      /* モバイル用ポップアップメニューのスタイル */
      #mobile-account-popup-menu {
        position: fixed;
        top: 60px;
        right: 10px;
        z-index: 100;
        background-color: var(--bg-card, #ffffff);
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--color-border, rgba(127, 127, 127, 0.25));
      }
      html.dark #mobile-account-popup-menu {
        background-color: var(--bg-card, #1f2937);
      }
    }
    @media (min-width: 768px) {
      .mobile-topbar { display: none !important; }
      .mobile-tab-bar { display: none !important; }
      #mobile-account-popup-menu { display: none !important; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header cursor-pointer" data-href="/index">
      <div class="flex items-center gap-3">
        <div class="logo-badge">
          <img src="/logo.webp" alt="Logo" class="logo-badge-img">
          <svg class="logo-badge-icon u-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.2rem;height:1.2rem;"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
        </div>
        <h1 class="font-bold text-sm sidebar-brand-text">並木中等教育学校18回生<br><span class="text-xs font-normal sidebar-brand-tagline">ダッシュボード</span></h1>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button data-href="/index" class="sidebar-nav-button" title="ホーム">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        <span class="sidebar-nav-text">ホーム</span>
      </button>
      <button data-href="/schedule" class="sidebar-nav-button" title="時間割">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span class="sidebar-nav-text">時間割</span>
      </button>
      <button data-href="/notice" class="sidebar-nav-button" title="お知らせ">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
        <span class="sidebar-nav-text">お知らせ</span>
      </button>
      <button data-href="/link" class="sidebar-nav-button" title="リンク">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
        <span class="sidebar-nav-text">リンク</span>
      </button>
      <button data-href="/calendar" class="sidebar-nav-button" title="カレンダー">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        <span class="sidebar-nav-text">カレンダー</span>
      </button>
      <button data-href="/classroom" class="sidebar-nav-button" title="Classroom">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        <span class="sidebar-nav-text">Classroom</span>
      </button>
      <button data-href="/transit" class="sidebar-nav-button mt-quarter-rem active" title="交通情報">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12a2 2 0 0 1 2 2v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z" /><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 9h16M8 6h.01M16 6h.01M7 21v-3M17 21v-3M8 13h.01M16 13h.01" /></svg>
        <span class="sidebar-nav-text">交通情報</span>

      <div class="sidebar-nav-divider">
        <button data-href="/privacy" class="sidebar-nav-button" title="プライバシーポリシー">
          <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          <span class="sidebar-nav-text">プライバシーポリシー</span>

        <button data-href="/terms" class="sidebar-nav-button" title="利用規約">
          <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 00.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          <span class="sidebar-nav-text">利用規約</span>

      <button data-href="/report" class="sidebar-nav-button nav-report-btn" title="報告">
        <svg class="icon-nav" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        <span class="sidebar-nav-text">報告</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div id="account-popup-menu" class="account-popup-menu">
        <div class="user-info-header">
          <img id="popup-user-avatar" src="https://via.placeholder.com/40?text=U" alt="User Avatar" class="popup-user-avatar" />
          <div class="user-info-text">
            <span id="popup-user-name" class="truncate popup-user-name">読み込み中...</span>
            <span id="popup-user-email" class="truncate popup-user-email">読み込み中...</span>
          </div>

        <button id="btn-admin-settings" class="account-popup-item">管理者設定</button>
        <button id="btn-personal-settings" class="account-popup-item">個人用設定</button>
        <button class="account-popup-item toggle-row" id="btn-toggle-theme-popup">
          <span>表示切替</span>

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-href]').forEach(el => {
        el.addEventListener('click', (e) => {
          window.location.href = el.dataset.href;
        });
      });
    });

    // 既定アバター: 終了済みの外部画像サービス(via.placeholder.com)に頼らず、頭文字入りの画像をその場で作る
    let avatarInitial = 'U';
    function avatarFallback(name) {
      const first = Array.from(String(name || '').trim())[0] || 'U';
      const ch = /[&<>"']/.test(first) ? 'U' : first;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#3b82f6"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="18" fill="#fff">${ch}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      toggleSwitch?.classList.toggle('on', document.documentElement.classList.contains('dark'));
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      html.classList.toggle('dark', !isDark);
      html.classList.toggle('light', isDark);
      localStorage.setItem('namiki-theme', isDark ? 'light' : 'dark');
      initThemeToggle();
    }

    async function loadProfile() {
      const response = await fetch('/api/profile');
      if (response.status === 401) { window.location.href = '/login'; return; }
      if (!response.ok) return;
      const profile = await response.json();
      const studentId = profile.id && profile.id !== 'Unknown' ? profile.id : '学籍番号未設定';
      document.getElementById('sidebar-user-id').textContent = studentId;
      document.getElementById('sidebar-user-name').textContent = profile.name || 'ユーザー';
      document.getElementById('popup-user-name').textContent = profile.name || 'ユーザー';
      document.getElementById('popup-user-email').textContent = profile.email || 'メールアドレス未設定';
      avatarInitial = profile.name || 'U';
      const avatar = profile.picture && profile.picture !== 'admin.png'
        ? profile.picture
        : avatarFallback(avatarInitial);
      document.getElementById('sidebar-user-avatar').src = avatar;
      document.getElementById('popup-user-avatar').src = avatar;
      document.getElementById('mobile-user-avatar').src = avatar;
    }

    document.getElementById('sidebar-user-toggle')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('account-popup-menu')?.classList.toggle('show');
    });
    document.getElementById('mobile-user-avatar-btn')?.addEventListener('click', (event) => {
      event.stopPropagation();
      document.getElementById('mobile-account-popup-menu')?.classList.toggle('show');
    });
    document.getElementById('btn-admin-settings')?.addEventListener('click', () => { window.location.href = '/admin'; });
    document.getElementById('btn-personal-settings')?.addEventListener('click', () => { window.location.href = '/setting'; });
    document.getElementById('btn-toggle-theme-popup')?.addEventListener('click', toggleTheme);
    document.addEventListener('click', () => {
      document.getElementById('account-popup-menu')?.classList.remove('show');
      document.getElementById('mobile-account-popup-menu')?.classList.remove('show');
    });
    initThemeToggle();
    // アバター画像を読み込めないときは、頭文字の画像に差し替える
    ['sidebar-user-avatar', 'popup-user-avatar', 'mobile-user-avatar'].forEach((id) => {
      const img = document.getElementById(id);
      if (!img) return;
      img.src = avatarFallback(avatarInitial);
      img.addEventListener('error', () => {
        if (img.dataset.fallback) return;
        img.dataset.fallback = '1';
        img.src = avatarFallback(avatarInitial);
      });
    });
    loadProfile().catch(() => {});

    document.addEventListener('click', (event) => {
      if (event.target.closest('#sidebar-user-toggle')) {
        event.stopPropagation();
        document.getElementById('account-popup-menu')?.classList.toggle('show');
      }
      if (event.target.closest('#mobile-user-avatar-btn')) {
        event.stopPropagation();
        const menu = document.getElementById('mobile-account-popup-menu');
        menu?.classList.toggle('show');
        if (menu) menu.style.display = menu.classList.contains('show') ? 'block' : 'none';
      }
    });
  </script>
  <script nonce="%%CSP_NONCE%%">

    (() => {

      const STATION_GROUP_M = 2000;                    // 同名駅を「同じ駅」とみなす距離
      const HIT_PAD = (window.L && L.Browser && L.Browser.mobile) ? 8 : 2;

      const S = {
        map: null, overlay: null, tiles: null, cfg: null,
        on: { rail: true, bus: true, other: true, delayed: false, local: false, expw: false, closure: false },
        vehicles: [], vIndex: new Map(),
        feeds: new Map(), statics: new Map(),
        otherAvailable: false, // 「その他」の車両データがあるときだけ true
        selected: null, seq: { v: 0 }, roadSeq: { local: 0, expw: 0 },
        updatedAt: 0, stale: false, truncated: false, error: false,
        ignoreMapClick: false,
        layers: { local: null, expw: null },
        roadRenderer: null, meRenderer: null, meLayer: null
      };

      // ===== レイアウト調整 =====
      // モバイルの固定トップバーに地図の操作部が隠れたり、トップバーの分だけ画面が縦にはみ出したりしないようにする
      function fitLayout() {
        const root = document.documentElement;
        const main = document.querySelector('.app-main');
        if (!main) return;
        root.style.removeProperty('--tm-bar-clear');
        root.style.removeProperty('--tm-main-h');
        const mainRect = main.getBoundingClientRect();
        const mainTop = mainRect.top + window.scrollY;
        if (mainTop > 1) root.style.setProperty('--tm-main-h', Math.max(0, window.innerHeight - mainTop) + 'px');
        const bar = document.querySelector('.mobile-topbar');
        if (!bar) return;
        const cs = getComputedStyle(bar);
        if (cs.display === 'none' || (cs.position !== 'fixed' && cs.position !== 'absolute')) return;
        const contentTop = mainRect.top + (parseFloat(getComputedStyle(main).paddingTop) || 0);
        const clear = Math.max(0, bar.getBoundingClientRect().bottom + 6 - contentTop);
        if (clear > 0) root.style.setProperty('--tm-bar-clear', Math.round(clear) + 'px');
      }
      let fitRaf = 0;
      const scheduleFit = () => { if (!fitRaf) fitRaf = requestAnimationFrame(() => { fitRaf = 0; fitLayout(); }); };
      window.addEventListener('resize', scheduleFit);
      window.addEventListener('orientationchange', scheduleFit);
      window.addEventListener('load', scheduleFit);

      // ===== 共通ヘルパー =====
      async function api(url) {

        if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
        if (!res.ok) throw new Error('HTTP ' + res.status);

          canvas.style.height = h + 'px';
        }

        function arrow(x, y, deg, size) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate((deg * Math.PI) / 180);
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size * 0.78, size * 0.85);
          ctx.lineTo(0, size * 0.4);
          ctx.lineTo(-size * 0.78, size * 0.85);
          ctx.closePath();
          ctx.stroke();
          ctx.fill();
          ctx.restore();
        }

        function draw() {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          hits = [];
          const z = map.getZoom();
          const sel = S.selected;

          // 遅れている車両は最前面に描く
          const normal = [];
          const late = [];
          for (const v of S.vehicles) {
            if (typeof v.la !== 'number' || typeof v.lo !== 'number' || !isShown(v)) continue;
            (isLate(v) ? late : normal).push(v);
          }
          const size = z >= 15 ? 11 : z >= 13 ? 9 : 7;
          let selPoint = null;
          ctx.lineWidth = 3;
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#fff';
          for (const [group, isLatePass] of [[normal, false], [late, true]]) {
            for (const v of group) {
              const p = map.latLngToContainerPoint([v.la, v.lo]);
              if (p.x < -20 || p.y < -20 || p.x > w + 20 || p.y > h + 20) continue;
              ctx.fillStyle = vehicleColor(v);
              if (isLatePass) {
                ctx.save();
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size + 4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
              }
              if (typeof v.b === 'number' && z >= 12) arrow(p.x, p.y, v.b, size);
              else { ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.7, 0, Math.PI * 2); ctx.stroke(); ctx.fill(); }
              hits.push({ x: p.x, y: p.y, r: size + 6 + HIT_PAD, kind: 'vehicle', id: v.id });
              if (sel && sel.kind === 'vehicle' && sel.id === v.id) selPoint = p;
            }
          }

          if (S.cfg) {
            const p = map.latLngToContainerPoint([S.cfg.school.lat, S.cfg.school.lon]);
            if (p.x > -20 && p.y > -20 && p.x < w + 20 && p.y < h + 20) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
              ctx.fillStyle = '#e11d48';
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2.5;
              ctx.fill();
              ctx.stroke();
              ctx.fillStyle = '#fff';
              ctx.font = 'bold 12px system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('学', p.x, p.y + 0.5);
              hits.push({ x: p.x, y: p.y, r: 14 + HIT_PAD, kind: 'school', id: 'school' });
            }
          }

          // 選択中の車両のリングは、他の車両に隠れないよう最後に描く
          if (selPoint) {
            ctx.save();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(selPoint.x, selPoint.y, size + 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          placePopup();
        }

        function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

        function hitAt(pt) {
          let best = null;
          let bestD = Infinity;
          for (let i = hits.length - 1; i >= 0; i--) {
            const hit = hits[i];
            const d = (hit.x - pt.x) ** 2 + (hit.y - pt.y) ** 2;
            if (d <= hit.r * hit.r && d < bestD) { best = hit; bestD = d; }
          }
          return best;
        }

        function lookup(sel) {
          if (!sel) return null;
          if (sel.kind === 'vehicle') {
            const v = S.vIndex.get(sel.id);
            // 非表示にした車両のポップアップが残らないようにする
            return v && isShown(v) ? { kind: 'vehicle', ref: v, la: v.la, lo: v.lo } : null;
          }
          if (sel.kind === 'station') { return { kind: 'station', name: sel.name, routes: sel.routes, la: sel.la, lo: sel.lo }; }
          return S.cfg ? { kind: 'school', ref: null, la: S.cfg.school.lat, lo: S.cfg.school.lon } : null;
        }

        function placePopup() {
          const item = lookup(S.selected);
          if (!item) { pop.box.hidden = true; return; }
          const p = map.latLngToContainerPoint([item.la, item.lo]);
          const size = map.getSize();
          pop.box.hidden = false;
          const pw = pop.box.offsetWidth || 248;
          const ph = pop.box.offsetHeight || 140;
          const x = Math.min(Math.max(p.x, pw / 2 + 8), Math.max(pw / 2 + 8, size.x - pw / 2 - 8));
          let y = p.y - ph - 18;
          if (y < 8) y = Math.min(p.y + 18, Math.max(8, size.y - ph - 8));
          pop.box.style.left = Math.round(x - pw / 2) + 'px';
          pop.box.style.top = Math.round(y) + 'px';
        }

        function refreshPopup() {
          const item = lookup(S.selected);
          if (item) fillPopup(pop, item); else { S.selected = null; pop.box.hidden = true; }
        }

        map.on('move zoom moveend zoomend resize', () => { if (map.getSize().x !== w || map.getSize().y !== h) fit(); schedule(); });
        fit();
        return { schedule, hitAt, refreshPopup, fit };
      }

      function select(sel) {
        S.selected = sel;
        if (S.overlay) { S.overlay.refreshPopup(); S.overlay.schedule(); }
      }

      // ===== 車両データ =====
      // 「その他」は、該当データがある場合だけ表示対象にする(ボタンが隠れているのに要求してしまうのを防ぐ)
      function activeModes() {
        return MODES.filter((m) => S.on[m] && !(m === 'other' && !S.otherAvailable));
      }

      function updateCounts() {
        const counts = { rail: 0, bus: 0, other: 0 };
        S.vehicles.forEach((v) => { if (counts[v.m] !== undefined) counts[v.m]++; });
        requestAnimationFrame(() => {
          MODES.forEach((m) => {
            const badge = document.querySelector(`[data-tm-count="${m}"]`);
            if (badge) badge.textContent = S.on[m] ? String(counts[m]) : '';
          });
        });
        return counts;
      }

      function afterVehicles() {
        if (!S.map) return;
        S.vIndex = new Map(S.vehicles.map((v) => [v.id, v]));
        updateCounts();

        if (S.error) setStatus('更新できませんでした。自動で再試行します', 'error');
        else if (S.stale) setStatus(`位置データが古くなっています(最終 ${clock(S.updatedAt)})`, 'stale');
        else setStatus(`最終更新 ${clock(S.updatedAt)}` + (S.truncated ? ' ・ 表示数を制限中(拡大すると全て表示)' : ''), 'ok');

        const modes = activeModes();
        const shown = S.vehicles.filter(isShown).length;
        const roadsOn = S.on.local || S.on.expw;

        if (S.error && !S.vehicles.length && modes.length) showMsg('位置データを取得できませんでした。自動で再試行します。');
        else if (!modes.length && !roadsOn) showMsg('表示する項目がすべてオフです。上のボタンで表示できます。');
        else if (modes.length && S.updatedAt && shown === 0) showMsg(S.on.delayed ? 'この範囲に3分以上遅れている列車・バスはありません。' : 'この範囲に走行中の列車・バスの位置情報はありません。地図を動かすか、縮小してみてください。');
        else showMsg('');

        if (S.overlay) { S.overlay.refreshPopup(); S.overlay.schedule(); }
      }

      async function loadVehicles() {
        if (!S.map || document.hidden) return;
        const seq = ++S.seq.v;
        const modes = activeModes();
        if (!modes.length) { S.vehicles = []; S.error = false; afterVehicles(); return; }
        try {
          // 世界の端をまたぐ範囲になってもAPIに不正な値を送らないよう、緯度経度を丸める
          const b = S.map.getBounds().pad(0.15);
          const lng = (x) => Math.max(-180, Math.min(180, x));
          const lat = (y) => Math.max(-90, Math.min(90, y));
          const bbox = encodeURIComponent([lng(b.getWest()), lat(b.getSouth()), lng(b.getEast()), lat(b.getNorth())].map((n) => n.toFixed(5)).join(','));
          const data = await api(`/api/transit/map/vehicles?bbox=${bbox}&modes=${modes.join(',')}&limit=3000`);
          if (seq !== S.seq.v) return;
          S.vehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
          S.updatedAt = data.updatedAt || 0;
          S.stale = Boolean(data.stale);
          S.truncated = Boolean(data.truncated);
          S.error = false;
        } catch (_) {
          if (seq !== S.seq.v) return;
          S.error = true;
        }
        afterVehicles();
      }

      async function loadInfo() {
        try {
          const info = await api('/api/transit/map/info');
          const feeds = Array.isArray(info.feeds) ? info.feeds : [];
          S.feeds = new Map(feeds.map((f) => [f.id, f]));
          S.statics = new Map((info.statics || []).map((s) => [s.id, s]));
          const hasOther = feeds.some((f) => f.kind === 'vehicle' && f.mode === 'other');
          const chip = document.querySelector('[data-tm-layer="other"]');
          if (chip) chip.hidden = !hasOther;
          if (hasOther !== S.otherAvailable) { S.otherAvailable = hasOther; if (S.map) loadVehicles(); }
        } catch (_) {}
      }

      // ===== 路線・駅などの静的データ(Cache API + 有効期限) =====
      // 一度キャッシュしたら永久に更新されない状態にならないよう、期限切れで再取得する。
      // 再取得に失敗したときは古いキャッシュを使い、Cache API が使えない環境でも取得だけは行う。
      async function fetchGeoJson(url, cacheName, maxAgeMs) {
        const tsKey = 'namiki-transit-ts:' + cacheName;
        let ts = 0;
        try { ts = Number(localStorage.getItem(tsKey)) || 0; } catch (_) {}
        let cache = null;
        let cached = null;
        if ('caches' in window) {
          try { cache = await caches.open(cacheName); cached = await cache.match(url); } catch (_) { cache = null; cached = null; }
        }
        if (cached && ts && Date.now() - ts < maxAgeMs) return cached.json();
        try {
          const res = await rf(url, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
          if (res.status === 401) { window.location.href = '/login'; throw new Error('unauthorized'); }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          if (cache) {
            try { await cache.put(url, res.clone()); localStorage.setItem(tsKey, String(Date.now())); } catch (_) {}
          }
          return await res.json();
        } catch (err) {
          if (cached && err.message !== 'unauthorized') return cached.json();
          throw err;
        }
      }

      // ===== 路線図の設定 =====
      let routeLayer = null;

      function getRouteColor(props) {
        if (props.color) return props.color;
        if (props.line_color) return props.line_color;
        const name = props.N02_004 || props.N02_003 || props.company || props.route_name || props.name || '';
        if (!name) return '#64748b';
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash % 360);
        return `hsl(${hue}, 70%, 45%)`;
      }

      function getRouteWeight(zoom) {
        if (zoom >= 16) return 8;
        if (zoom >= 14) return 5;
        if (zoom >= 12) return 3;
        return 1.5;
      }

      async function loadGeoJsonRoutes() {
        if (!S.map) return;
        try {
          const geojson = await fetchGeoJson('/api/transit/railroadsection', 'namiki-transit-routes-v1', STATIC_CACHE_MS);
          const routeRenderer = L.canvas({ padding: 0.1, pane: 'transit-routes' });

          routeLayer = L.geoJSON(geojson, {
            renderer: routeRenderer,
            interactive: false,
            style: (feature) => {
              const props = feature.properties || {};
              return {
                color: getRouteColor(props),
                weight: getRouteWeight(S.map.getZoom()),
                opacity: 0.6
              };
            }
          }).addTo(S.map);

          S.map.on('zoomend', () => {
            if (routeLayer) {
              const currentZoom = S.map.getZoom();
              routeLayer.setStyle(() => ({
                weight: getRouteWeight(currentZoom)
              }));
            }
          });
        } catch (err) {
          console.error('路線図データの取得に失敗:', err);
        }
      }

      // ===== 駅 (Station) の設定 =====
      function getStationWeights(zoom) {
        const routeW = getRouteWeight(zoom);
        return {
          bg: routeW + 4,
          fg: Math.max(1, routeW + 1)
        };
      }

      function getStationName(props) {
        if (!props) return '';
        return props.name || props.station_name || props.N02_005 || props.station || '';
      }

      // 乗り入れ表示は「会社名」ではなく「路線名(会社名)」にする
      function routeLabel(p) {
        const route = p.route_name || p.N02_003 || '';
        const company = p.company || p.N02_004 || '';
        if (route && company && route !== company) return `${route}(${company})`;
        return route || company || '';
      }

      // GeoJSONのジオメトリから最初の座標を取り出す
      function firstLatLng(geometry) {
        let c = geometry && geometry.coordinates;
        while (Array.isArray(c) && Array.isArray(c[0])) c = c[0];
        return Array.isArray(c) && c.length >= 2 && isFinite(c[0]) && isFinite(c[1]) ? L.latLng(c[1], c[0]) : null;
      }

      async function loadGeoJsonStations() {
        if (!S.map) return;
        try {
          const geojson = await fetchGeoJson('/api/transit/station', 'namiki-transit-stations-v1', STATIC_CACHE_MS);
          const stationRenderer = L.canvas({ padding: 0.1, pane: 'transit-stations' });

          // 駅名ごとに、乗り入れ路線をまとめる(描画用のレイヤーを作らずデータだけで集計する)
          const groups = new Map();
          for (const f of (Array.isArray(geojson && geojson.features) ? geojson.features : [])) {
            const props = f.properties || {};
            const name = getStationName(props);
            if (!name) continue;
            if (!groups.has(name)) groups.set(name, []);
            groups.get(name).push({ at: firstLatLng(f.geometry), route: routeLabel(props) });
          }

          const handleStationClick = (feature, e) => {
            const pt = e.containerPoint || (S.map && S.map.latLngToContainerPoint(e.latlng));
            if (pt && S.overlay && S.overlay.hitAt(pt)) return;

            S.ignoreMapClick = true;
            setTimeout(() => { S.ignoreMapClick = false; }, 50);

            const props = feature.properties || {};
            const name = getStationName(props);
            let routes;
            if (name && groups.has(name)) {
              // 同じ名前でも遠く離れた駅の路線は混ぜない
              routes = groups.get(name)
                .filter((g) => !g.at || S.map.distance(e.latlng, g.at) <= STATION_GROUP_M)
                .map((g) => g.route);
            } else {
              routes = [routeLabel(props)];
            }
            routes = [...new Set(routes.filter(Boolean))];
            select({ kind: 'station', name, routes, la: e.latlng.lat, lo: e.latlng.lng });
          };

          const stationBgLayer = L.geoJSON(geojson, {
            renderer: stationRenderer,
            interactive: false,
            style: () => ({ color: '#000000', lineCap: 'square' })
          });

          const stationFgLayer = L.geoJSON(geojson, {
            renderer: stationRenderer,
            interactive: true,
            style: () => ({ color: '#ffffff', lineCap: 'square' }),
            onEachFeature: (feature, layer) => {
              layer.on('click', (e) => handleStationClick(feature, e));
            }
          });

          function updateStationDisplay() {
            const z = S.map.getZoom();
            // ズームレベル8以下では非表示、9以上で長方形を表示する
            if (z <= 8) {
              if (S.map.hasLayer(stationBgLayer)) S.map.removeLayer(stationBgLayer);
              if (S.map.hasLayer(stationFgLayer)) S.map.removeLayer(stationFgLayer);
            } else {
              if (!S.map.hasLayer(stationBgLayer)) S.map.addLayer(stationBgLayer);
              if (!S.map.hasLayer(stationFgLayer)) S.map.addLayer(stationFgLayer);

              const w = getStationWeights(z);
              stationBgLayer.setStyle({ weight: w.bg, opacity: 1 });
              stationFgLayer.setStyle({ weight: w.fg, opacity: 1 });
            }
          }

          S.map.on('zoomend', updateStationDisplay);
          updateStationDisplay();
        } catch (err) {
          console.error('駅データの取得に失敗:', err);
        }
      }

      // ===== 道路情報 (一般道・高速道路) =====
      // 通行止め・渋滞・対面通行の判定を1か所にまとめる(表示スタイルと「のみ」フィルターで判定がずれないように)
      function roadState(props) {
        if (props.rd !== undefined) {
          const rd = String(props.rd || '');
          if (/通行止|閉鎖/.test(rd)) return 'closure';
          if (/渋滞|混雑|対面通行/.test(rd)) return 'jam';
          return 'normal';
        }
        const st = props.status;
        if (st === 'closure' || st === 'closed') return 'closure';
        if (st === 'jam' || st === 'heavy') return 'jam';
        return 'normal';
      }

      function getRoadStyle(feature, type) {
        const state = roadState(feature.properties || {});
        let color = type === 'expw' ? '#3b82f6' : '#10b981';
        let weight = type === 'expw' ? 4 : 3;
        let opacity = 0.7;
        let className = '';

        if (state === 'closure') {
          color = '#dc2626';
          weight = 8; // タップしやすいよう太くする
          opacity = 1.0;
          className = 'road-alert-blink';
        } else if (state === 'jam') {
          color = '#f59e0b';
          weight = 8;
          opacity = 0.9;
          className = 'road-alert-blink';
        }
        return { color, weight, opacity, className };
      }

      // 外部データを HTML 文字列に埋め込まず、DOM として組み立てる(表示内容にタグが含まれていても実行されない)
      function roadPopupContent(props) {
        const box = el('div', 'tm-road-body is-' + roadState(props));
        if (props.r !== undefined || props.rd !== undefined) {
          // 例: "札幌夕張線 ３号線は栗山町角田付近でその他により上下線が通行止になっています。"
          const lead = `${props.i ? props.i + 'で' : ''}${props.c ? props.c + 'により' : ''}${props.d ? props.d + '線が' : ''}`;
          box.append(
            el('b', '', String(props.r || '名称不明')), el('br'),
            document.createTextNode(lead),
            el('b', '', String(props.rd || '状況不明')),
            document.createTextNode('になっています。')
          );
          return box;
        }
        box.append(el('b', '', String(props.name || props.road_name || '名称不明')), el('br'), document.createTextNode(`状況: ${props.status || '順調'}`));
        if (props.detail) box.append(el('br'), document.createTextNode(`詳細: ${props.detail}`));
        return box;
      }

      function setCount(key, text) {
        requestAnimationFrame(() => {
          const badge = document.querySelector(`[data-tm-count="${key}"]`);
          if (badge) badge.textContent = text;
        });
      }

      async function loadRoadData(type) {
        if (!S.map || !S.layers[type]) return;
        const seq = ++S.roadSeq[type];
        if (!S.on[type]) { S.layers[type].clearLayers(); setCount(type, ''); return; }
        try {
          const geojson = await api(`/api/road/${type}`);
          // 取得中にオフにされた・別の更新が始まった場合は捨てる
          if (seq !== S.roadSeq[type] || !S.on[type]) return;

          S.layers[type].clearLayers();
          const geoLayer = L.geoJSON(geojson, {
            renderer: S.roadRenderer,
            filter: (feature) => !S.on.closure || roadState(feature.properties || {}) !== 'normal',
            style: (feature) => getRoadStyle(feature, type),
            onEachFeature: (feature, layer) => {
              layer.on('click', (e) => {
                // 車両が重なっているときは車両の詳細を優先する
                if (S.overlay && S.overlay.hitAt(e.containerPoint)) return;
                L.popup({ className: 'tm-road-pop', maxWidth: 280 })
                  .setLatLng(e.latlng)
                  .setContent(roadPopupContent(feature.properties || {}))
                  .openOn(S.map);
              });
            }
          });
          geoLayer.addTo(S.layers[type]);
          setCount(type, String(geoLayer.getLayers().length));
        } catch (err) {
          if (err && err.message === 'unauthorized') return;
          console.error(`道路情報(${type})の取得に失敗:`, err);
          if (seq === S.roadSeq[type]) showMsg(`${ROAD_LABEL[type]}の情報を取得できませんでした。`, false, 5000);
        }
      }

      function refreshAllRoadData() {
        if (S.on.local) loadRoadData('local');
        if (S.on.expw) loadRoadData('expw');
      }

      // ===== UI・ボタン制御 =====
      function bindControls() {
        document.querySelectorAll('[data-tm-layer]').forEach((btn) => {
          const key = btn.dataset.tmLayer;
          btn.setAttribute('aria-pressed', String(S.on[key]));
          btn.addEventListener('click', () => {
            if (!S.map) return; // 地図を表示できていないときは何もしない
            S.on[key] = !S.on[key];
            btn.setAttribute('aria-pressed', String(S.on[key]));
            savePrefs();

            if (MODES.includes(key)) {
              afterVehicles(); // 先に画面へ反映してから最新データを取り直す
              loadVehicles();
            } else if (ROAD_MODES.includes(key)) {
              if (S.on[key]) {
                if (!S.map.hasLayer(S.layers[key])) S.map.addLayer(S.layers[key]);
              } else if (S.map.hasLayer(S.layers[key])) {
                S.map.removeLayer(S.layers[key]);
              }
              loadRoadData(key);
            } else if (key === 'closure') {
              if (S.on.closure && !S.on.local && !S.on.expw) showMsg('「通行止め・渋滞のみ」は、一般道か高速道路を表示しているときに使えます。', false, 5000);
              refreshAllRoadData();
            } else {
              afterVehicles();
            }
          });
        });
      }

      // 現在地の表示(位置の点と、精度の円)
      function showMyLocation(lat, lon, accuracy) {
        if (!S.map || !S.meRenderer) return;
        if (S.meLayer) S.meLayer.remove();
        S.meLayer = L.layerGroup().addTo(S.map);
        if (accuracy && accuracy < 3000) {
          L.circle([lat, lon], { radius: accuracy, renderer: S.meRenderer, interactive: false, color: '#2563eb', weight: 1, fillColor: '#2563eb', fillOpacity: 0.1 }).addTo(S.meLayer);
        }
        L.circleMarker([lat, lon], { radius: 7, renderer: S.meRenderer, interactive: false, color: '#ffffff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(S.meLayer);
      }

      function fail(text) {
        showMsg(text, true);
        setStatus('地図を表示できません', 'error');
      }

      async function init() {
        loadPrefs();
        bindControls();
        const infoReady = loadInfo();
        setInterval(() => { if (!document.hidden) loadInfo(); }, 60 * 1000);

        if (typeof L === 'undefined') { fail('地図ライブラリ(Leaflet)を読み込めませんでした。'); return; }
        let cfg;
        try { cfg = await api('/api/transit/map/config'); } catch (_) {
          fail('地図の設定を取得できませんでした。ページを再読み込みしてください。');
          return;
        }
        if (!cfg || !cfg.school || !cfg.tiles || !cfg.tiles.template) {
          fail('地図の設定が正しくありません。管理者に連絡してください。');
          return;
        }
        S.cfg = cfg;
        const view = Object.assign({ zoom: 13, minZoom: 5, maxZoom: 18 }, cfg.view || {});
        const tileUrl = cfg.tiles.template.replace('{layer}', 'pale');

        const map = L.map('tm-map', {
          center: [cfg.school.lat, cfg.school.lon], zoom: view.zoom, minZoom: view.minZoom, maxZoom: view.maxZoom,
          zoomAnimation: false,
          preferCanvas: true,
          attributionControl: true
        });
        S.map = map;
        map.attributionControl.setPrefix(false);
        map.attributionControl.addAttribution('データ: <a href="https://www.odpt.org/" target="_blank" rel="noopener noreferrer">公共交通オープンデータセンター</a>・<a href="https://www.jartic.or.jp/" target="_blank" rel="noopener noreferrer">JARTIC</a>(推測)等');

        // 重なり順: 地図タイル < 路線 < 駅 < 道路 < 現在地 < 車両(Canvas)。
        // 道路は、下にある Canvas(路線・駅)にクリックを奪われないよう、それらより上の専用レイヤーに置く。
        [['transit-routes', 400], ['transit-stations', 410], ['transit-roads', 420], ['transit-me', 430]].forEach(([name, z]) => {
          map.createPane(name).style.zIndex = z;
        });
        S.roadRenderer = L.svg({ pane: 'transit-roads', padding: 0.1 });
        S.meRenderer = L.svg({ pane: 'transit-me', padding: 0.1 });

        S.tiles = L.tileLayer(tileUrl, {
          minZoom: view.minZoom, maxZoom: view.maxZoom,
          maxNativeZoom: Math.min(view.maxZoom, 18), // 地理院タイルはズーム18まで。それ以上は拡大表示で空白を防ぐ
          errorTileUrl: BLANK_TILE, keepBuffer: 2,
          attribution: '地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院(地理院タイル)</a>'
        }).addTo(map);
        L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
        S.overlay = createOverlay(map);

        // 道路用レイヤーの追加
        S.layers.local = L.layerGroup();
        S.layers.expw = L.layerGroup();
        if (S.on.local) map.addLayer(S.layers.local);
        if (S.on.expw) map.addLayer(S.layers.expw);

        $('tm-home')?.addEventListener('click', () => map.setView([cfg.school.lat, cfg.school.lon], view.zoom));

        $('tm-geolocation')?.addEventListener('click', () => {
          if (!navigator.geolocation) {
            showMsg('お使いのブラウザは現在地機能に対応していません。', false, 4000);
            return;
          }

          const geoBtn = $('tm-geolocation');
          const label = geoBtn.querySelector('.tm-btn-label');
          const done = () => { if (label) label.textContent = '現在地へ'; geoBtn.disabled = false; };
          if (label) label.textContent = '取得中...';
          geoBtn.disabled = true;

          navigator.geolocation.getCurrentPosition(
            (position) => {
              done();
              const { latitude, longitude, accuracy } = position.coords;
              showMyLocation(latitude, longitude, accuracy);
              map.setView([latitude, longitude], 15);
            },
            (error) => {
              done();
              const text = error && error.code === 1 ? '位置情報の利用が許可されていません。ブラウザや端末の設定を確認してください。'
                : error && error.code === 3 ? '現在地の取得がタイムアウトしました。もう一度お試しください。'
                : '現在地を取得できませんでした。端末の位置情報設定を確認してください。';
              showMsg(text, false, 5000);
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
          );
        });

        map.on('click', (e) => {
          const hit = S.overlay.hitAt(e.containerPoint);
          if (hit) {
            select({ kind: hit.kind, id: hit.id });
          } else if (!S.ignoreMapClick) {
            select(null);
          }
        });

        map.on('mousemove', (e) => { map.getContainer().style.cursor = S.overlay.hitAt(e.containerPoint) ? 'pointer' : ''; });
        let moveTimer = 0;
        map.on('moveend zoomend', () => { clearTimeout(moveTimer); moveTimer = setTimeout(() => { loadVehicles(); }, 250); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') select(null); });
        if (typeof ResizeObserver === 'function') new ResizeObserver(() => map.invalidateSize({ pan: false })).observe(map.getContainer());

        const pollMs = Math.max(15, Math.round((cfg.pollSec || 30) / 2)) * 1000;
        setInterval(() => { if (!document.hidden) loadVehicles(); }, pollMs);
        setInterval(() => { if (!document.hidden) refreshAllRoadData(); }, ROAD_REFRESH_MS);

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            loadVehicles();
            loadInfo();
            refreshAllRoadData();
          }
        });

        S.overlay.schedule();
        await infoReady; // 「その他」の有無が分かってから最初の車両取得を行う
        loadVehicles();

        loadGeoJsonRoutes();
        loadGeoJsonStations();
        refreshAllRoadData();
      }

      init().catch((err) => {
        console.error('交通マップの初期化に失敗:', err);
        fail('地図の初期化中にエラーが発生しました。ページを再読み込みしてください。');
      });
    })();
  </script>
</body>
</html>
