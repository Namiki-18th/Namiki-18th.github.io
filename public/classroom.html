            <svg class="icon-sm" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.84 17.522 2 12 2z" /></svg>
            GitHub
          </a>
        </div>
      </footer>
    </main>
  </div>

  <script nonce="%%CSP_NONCE%%">
    let profileData = null;
    let currentClassroomItems = [];
    let currentFilterType = 'announcement';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function linkify(text) {
      if (!text) return '';
      const escaped = escapeHtml(text);
      const urlPattern = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlPattern, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="auto-link">${url}</a>`;
      });
    }

    function toggleAccountMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('account-popup-menu');
      if (menu) menu.classList.toggle('show');
    }

    document.addEventListener('click', (event) => {
      const menu = document.getElementById('account-popup-menu');
      const toggleBtn = document.getElementById('sidebar-user-toggle');
      if (menu && menu.classList.contains('show')) {
        if (!menu.contains(event.target) && !toggleBtn.contains(event.target)) {
          menu.classList.remove('show');
        }
      }
    });

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      if(toggleSwitch) {
        if (document.documentElement.classList.contains('dark')) {
          toggleSwitch.classList.add('on');
        } else {
          toggleSwitch.classList.remove('on');
        }
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        localStorage.setItem('namiki-theme', 'light');
        if (toggleSwitch) toggleSwitch.classList.remove('on');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        localStorage.setItem('namiki-theme', 'dark');
        if (toggleSwitch) toggleSwitch.classList.add('on');
      }
    }

    function handleAdminSettings() { window.location.href = '/admin'; }
    function handlePersonalSettings() { alert('個人用設定は開発中です。'); }

    async function loadUserProfile() {
      try {
        const res = await fetch('/api/profile').catch(() => ({ ok: false }));
        if (res.status === 401) {
          window.location.href = '/login';
          return;
        }
        if (res.ok) profileData = await res.json();
        else profileData = { name: '並木 太郎', email: 'namiki.taro@example.com', id: '180001', role: 'student', userClass: '3-A', picture: '' };

        renderUserProfile();
      } catch (err) {
        console.error('プロファイル取得エラー:', err);
      }
    }

    function renderUserProfile() {
      if (!profileData) return;
      const p = profileData;
      const studentIdText = (p.id && p.id !== 'Unknown') ? p.id : '学籍番号未設定';
      document.getElementById('sidebar-user-id').textContent = `${studentIdText}`;
      document.getElementById('sidebar-user-name').textContent = p.name || 'ユーザー';
      
      const popupName = document.getElementById('popup-user-name');
      if (popupName) popupName.textContent = p.name || 'ユーザー';
      const popupEmail = document.getElementById('popup-user-email');
      if (popupEmail) popupEmail.textContent = p.email || 'メールアドレス未設定';

      const userAvatar = (p.picture && p.picture !== 'admin.png') ? p.picture : `https://via.placeholder.com/40/3b82f6/ffffff?text=${encodeURIComponent(p.name ? p.name.charAt(0) : 'U')}`;
      
      const sidebarAvatar = document.getElementById('sidebar-user-avatar');
      if (sidebarAvatar) sidebarAvatar.src = userAvatar;

      const mobileAvatar = document.getElementById('mobile-user-avatar');
      if (mobileAvatar) mobileAvatar.src = userAvatar;

      const popupAvatar = document.getElementById('popup-user-avatar');
      if (popupAvatar) popupAvatar.src = userAvatar;
    }

    async function fetchAndRenderClassroom() {
      const container = document.getElementById('classroom-data-list');
      if (!container) return;

      container.innerHTML = '<div class="placeholder-text">最新のClassroomデータを取得中...</div>';

      try {
        const res = await fetch('/api/classroom').catch(() => ({ ok: false }));
        if (res.ok) {
          const data = await res.json();
          currentClassroomItems = Array.isArray(data) ? data : (data.items || []);
        } else {
          currentClassroomItems = [];
        }
        renderClassroomData(true);
      } catch (err) {
        console.error('Classroom Fetch Error:', err);
        container.innerHTML = '<div class="empty-state-text">Classroomデータの取得に失敗しました。</div>';
      }
    }

    function setFilterType(type) {
      currentFilterType = type;
      ['work', 'announce', 'material'].forEach(t => {
        const btn = document.getElementById(`cr-filter-${t}`);
        if(btn) btn.classList.remove('active');
      });
      const activeMap = { 'courseWork':'work', 'announcement':'announce', 'material':'material' };
      const activeBtn = document.getElementById(`cr-filter-${activeMap[type]}`);
      if(activeBtn) activeBtn.classList.add('active');

      renderClassroomData(true);
    }

    function resetClassroomFilters() {
      const searchEl = document.getElementById('cr-search-input');
      const dateFromEl = document.getElementById('cr-date-from');
      const dateToEl = document.getElementById('cr-date-to');
      const sortEl = document.getElementById('cr-sort-select');
      if (searchEl) searchEl.value = '';
      if (dateFromEl) dateFromEl.value = '';
      if (dateToEl) dateToEl.value = '';
      if (sortEl) sortEl.value = 'desc';
      renderClassroomData(true);
    }

    function renderClassroomData(shouldScrollToTop = false) {
      const container = document.getElementById('classroom-data-list');
      if (!container) return;

      let items = currentClassroomItems.filter(i => i.type === currentFilterType);

      const searchQuery = (document.getElementById('cr-search-input')?.value || '').toLowerCase().trim();
      const dateFrom = document.getElementById('cr-date-from')?.value;
      const dateTo = document.getElementById('cr-date-to')?.value;
      const sortOrder = document.getElementById('cr-sort-select')?.value || 'desc';

      if (searchQuery) {
        items = items.filter(item => 
          (item.title && item.title.toLowerCase().includes(searchQuery)) ||
          (item.description && item.description.toLowerCase().includes(searchQuery)) ||
          (item.author && item.author.toLowerCase().includes(searchQuery))
        );
      }

      if (dateFrom || dateTo) {
        items = items.filter(item => {
          if (!item.creationTime) return false;
          const itemDate = new Date(item.creationTime).toISOString().split('T')[0];
          if (dateFrom && itemDate < dateFrom) return false;
          if (dateTo && itemDate > dateTo) return false;
          return true;
        });
      }

      items.sort((a, b) => {
        const timeA = a.creationTime ? new Date(a.creationTime).getTime() : 0;
        const timeB = b.creationTime ? new Date(b.creationTime).getTime() : 0;
        return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
      });

      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state-text">該当する情報がありません。</div>';
        return;
      }

      const getMaterialIcon = (m) => {
        const type = (m.type || '').toLowerCase();
        const url = (m.url || '').toLowerCase();
        
        if (type === 'youtube' || url.includes('youtube.com') || url.includes('youtu.be')) {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="gen-315af3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>`;
        }
        if (type === 'drivefile' || type === 'file' || url.includes('drive.google.com')) {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="gen-315af3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>`;
        }
        if (type === 'form' || url.includes('docs.google.com/forms')) {
          return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="gen-315af3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>`;
        }
        return `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="gen-315af3"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>`;
      };

      container.innerHTML = items.map(item => {
        const createdDate = item.creationTime ? new Date(item.creationTime).toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
        const dueDate = item.dueDate ? new Date(item.dueDate).toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;

        const authorAvatar = item.authorPhotoUrl
          ? `<img src="${escapeHtml(item.authorPhotoUrl)}" alt="${escapeHtml(item.author || 'User')}" class="gen-cfe030 js-avatar-fallback" />`
          : (item.author ? `<div class="gen-e41d0d">${escapeHtml(item.author.charAt(0))}</div>` : '');

        const authorInfoHtml = `
          <div class="gen-d2afe5">
            ${authorAvatar}
            <span class="truncate gen-0318b0">${escapeHtml(item.author || '投稿者')}</span>
          </div>
        `;

        const dateHtml = `<span class="gen-804a6a">${escapeHtml(item.courseName || '')}${item.courseName ? ' ・ ' : ''}${createdDate}</span>`;

        const materialsHtml = (item.materials && item.materials.length > 0) ? `
          <div class="gen-686ca0">
            <span class="gen-936c68">添付資料:</span>
            <div class="gen-d3890b">
              ${item.materials.map(m => `
                <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener noreferrer" class="truncate gen-0a4dcd">
                  ${getMaterialIcon(m)}
                  <span class="truncate gen-49cdf8">${escapeHtml(m.title || 'リンクを開く')}</span>
                </a>
              `).join('')}
            </div>
          </div>
        ` : '';

        return `
          <div class="notice-card gen-d85c4e">
            <div class="gen-b2fd88">
              ${authorInfoHtml}
              ${dateHtml}
            </div>
            <h4 class="notice-card-title gen-7160e3">${escapeHtml(item.title || '無題')}</h4>
            ${dueDate ? `
              <div class="gen-0e62d2">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="gen-542ace"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                提出期限: ${dueDate}
              </div>
            ` : ''}
            <p class="notice-card-body gen-b002ba">${linkify(item.description)}</p>
            ${materialsHtml}
            ${item.alternateLink ? `
              <div class="gen-755663">
                <a href="${escapeHtml(item.alternateLink)}" target="_blank" rel="noopener noreferrer" class="card-link-button gen-0a07c7">Classroomで開く &rarr;</a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      if (shouldScrollToTop) {
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 100);
      }
    }

    // 💡CSP対応: インラインイベント属性(onclick/onerror/onchange/oninput)を廃止し、
    // addEventListener によるイベント登録に統一。
    function initInlineEventReplacements() {
      // ナビゲーション（data-href属性を持つ要素はクリックで遷移）
      document.querySelectorAll('[data-href]').forEach(el => {
        el.addEventListener('click', () => {
          location.href = el.getAttribute('data-href');
        });
      });

      // ロゴ画像の読み込み失敗時、絵文字フォールバックを表示
      document.querySelectorAll('.js-logo-fallback').forEach(img => {
        img.addEventListener('error', function () {
          this.style.display = 'none';
          if (this.nextElementSibling) this.nextElementSibling.style.display = 'inline';
        });
      });

      // アカウントメニュー開閉
      const sidebarUserToggle = document.getElementById('sidebar-user-toggle');
      if (sidebarUserToggle) {
        sidebarUserToggle.addEventListener('click', (event) => toggleAccountMenu(event));
      }

      // 管理者設定 / 個人設定 / テーマ切り替え（ポップアップ内・モバイル両方）
      const btnAdminSettings = document.getElementById('btn-admin-settings');
      if (btnAdminSettings) btnAdminSettings.addEventListener('click', handleAdminSettings);

      const btnPersonalSettings = document.getElementById('btn-personal-settings');
      if (btnPersonalSettings) btnPersonalSettings.addEventListener('click', handlePersonalSettings);

      const btnToggleThemePopup = document.getElementById('btn-toggle-theme-popup');
      if (btnToggleThemePopup) btnToggleThemePopup.addEventListener('click', toggleTheme);

      const btnToggleThemeMobile = document.getElementById('btn-toggle-theme-mobile');
      if (btnToggleThemeMobile) btnToggleThemeMobile.addEventListener('click', toggleTheme);

      // Classroomフィルターボタン（data-filter-type属性からタイプを取得）
      document.querySelectorAll('[data-filter-type]').forEach(btn => {
        btn.addEventListener('click', () => setFilterType(btn.getAttribute('data-filter-type')));
      });

      // 検索・日付・並び替えの入力変更で再描画
      const searchInput = document.getElementById('cr-search-input');
      if (searchInput) searchInput.addEventListener('input', () => renderClassroomData());

      const dateFrom = document.getElementById('cr-date-from');
      if (dateFrom) dateFrom.addEventListener('change', () => renderClassroomData());

      const dateTo = document.getElementById('cr-date-to');
      if (dateTo) dateTo.addEventListener('change', () => renderClassroomData());

      const sortSelect = document.getElementById('cr-sort-select');
      if (sortSelect) sortSelect.addEventListener('change', () => renderClassroomData());

      // フィルターリセットボタン
      const resetBtn = document.getElementById('cr-reset-filters-btn');
      if (resetBtn) resetBtn.addEventListener('click', () => resetClassroomFilters());

      // アイコン(投稿者アバター)の読み込み失敗時は非表示化。
      // 動的に生成される要素があるため、キャプチャフェーズでイベント委譲する。
      document.addEventListener('error', (event) => {
        if (event.target && event.target.classList && event.target.classList.contains('js-avatar-fallback')) {
          event.target.style.display = 'none';
        }
      }, true);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initInlineEventReplacements();
      loadUserProfile();
      fetchAndRenderClassroom();
    });
  </script>
</body>
</html>
