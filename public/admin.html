<!DOCTYPE html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理者ダッシュボード - 学校生活ポータル</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              dark: {
                bg: '#000000',
                card: '#0a0a0c',
                border: 'rgba(255, 255, 255, 0.1)',
                hover: 'rgba(255, 255, 255, 0.06)'
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style> body { font-family: 'Inter', sans-serif; } </style>
  </head>
  <body class="bg-dark-bg text-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-dark-card border-b border-white/15 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="text-2xl">⚙️</span>
          <h1 class="font-bold text-lg text-white">管理者コントロールパネル</h1>
        </div>
        <div class="flex items-center gap-4">
          <span id="current-admin-name" class="text-xs text-gray-400 hidden sm:inline">認証確認中...</span>
          <a href="index.html" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-semibold transition-all">
            ← ダッシュボードに戻る
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
      
      <!-- Section Header -->
      <div class="bg-dark-card border border-white/10 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 class="text-xl font-bold text-white">ユーザー権限・クラス・アカウント管理</h2>
          <p class="text-gray-400 text-sm mt-1">生徒・教員の所属クラス、権限、およびアカウントの停止（Suspend）を設定します。</p>
        </div>
        <button onclick="saveAllSettings()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold shadow-lg transition-all">
          💾 すべての変更を保存する
        </button>
      </div>

      <!-- Users Table -->
      <div class="bg-dark-card border border-white/10 rounded-2xl shadow-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-white/10 text-gray-400 text-xs uppercase tracking-wider bg-white/5">
              <th class="py-4 px-6 font-semibold">ユーザー名 / メール</th>
              <th class="py-4 px-6 font-semibold">所属クラス</th>
              <th class="py-4 px-6 font-semibold">権限</th>
              <th class="py-4 px-6 font-semibold">アカウント状態</th>
              <th class="py-4 px-6 font-semibold text-right">操作</th>
            </tr>
          </thead>
          <tbody id="admin-user-table" class="divide-y divide-white/5">
            <tr>
              <td colspan="5" class="text-center py-8 text-gray-400 text-sm">ユーザーデータを読み込んでいます...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark-card border-t border-white/10 py-6 text-center text-gray-400 text-xs">
      &copy; 2026 学校生活ダッシュボード 管理者システム
    </footer>

    <!-- Admin Logic & Access Control -->
    <script>
      let usersData = [];

      async function checkAdminAuthAndLoad() {
        try {
          const res = await fetch('/api/profile');
          if (!res.ok) throw new Error('未認証またはセッションが切れています');
          const profile = await res.json();
          
          if (!profile || profile.role !== 'admin') {
            alert('アクセス権限がありません。管理者のみアクセス可能です。');
            window.location.href = 'index.html';
            return;
          }

          document.getElementById('current-admin-name').textContent = `ログイン中: ${profile.name}`;
          loadAdminData();
        } catch (err) {
          console.error('認証チェックエラー:', err);
          window.location.href = 'login';
        }
      }

      async function loadAdminData() {
        try {
          const res = await fetch('/api/admin/users');
          if (!res.ok) throw new Error('ユーザー一覧の取得に失敗しました');
          usersData = await res.json();
          renderAdminTable();
        } catch (err) {
          console.error(err);
          document.getElementById('admin-user-table').innerHTML = `
            <tr><td colspan="5" class="text-center py-8 text-red-400 text-sm">データ読み込みエラーが発生しました。</td></tr>
          `;
        }
      }

      function renderAdminTable() {
        const tbody = document.getElementById('admin-user-table');
        if (usersData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400 text-sm">ユーザーが登録されていません。</td></tr>`;
          return;
        }

        tbody.innerHTML = usersData.map(u => {
          const encodedEmail = encodeURIComponent(u.email);
          const currentClass = u.userClass || 'A組';
          const currentStatus = u.status || 'active'; // 'active' または 'suspended'
          
          return `
            <tr class="hover:bg-white/5 transition-colors">
              <td class="py-4 px-6 flex items-center gap-3">
                ${u.picture ? `<img src="${u.picture}" alt="" class="w-8 h-8 rounded-full object-cover border border-white/20">` : ''}
                <div>
                  <div class="font-bold text-white text-sm">${u.name}</div>
                  <div class="text-xs text-gray-400 font-mono">${u.email}</div>
                </div>
              </td>
              <td class="py-4 px-6">
                <select id="class-${encodedEmail}" class="bg-black/50 border border-white/15 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500">
                  <option value="管理者" ${currentClass === '管理者' ? 'selected' : ''}>管理者</option>
                  <option value="A組" ${currentClass === 'A組' ? 'selected' : ''}>A組</option>
                  <option value="B組" ${currentClass === 'B組' ? 'selected' : ''}>B組</option>
                  <option value="C組" ${currentClass === 'C組' ? 'selected' : ''}>C組</option>
                  <option value="D組" ${currentClass === 'D組' ? 'selected' : ''}>D組</option>
                </select>
              </td>
              <td class="py-4 px-6">
                <select id="role-${encodedEmail}" class="bg-black/50 border border-white/15 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500">
                  <option value="student" ${u.role === 'student' ? 'selected' : ''}>生徒</option>
                  <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>管理者</option>
                </select>
              </td>
              <td class="py-4 px-6">
                <select id="status-${encodedEmail}" class="bg-black/50 border border-white/15 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-red-500">
                  <option value="active" ${currentStatus === 'active' ? 'selected' : ''}>🟢 有効 (Active)</option>
                  <option value="suspended" ${currentStatus === 'suspended' ? 'selected' : ''}>🔴 停止 (Suspended)</option>
                </select>
              </td>
              <td class="py-4 px-6 text-right">
                <button onclick="saveUser('${encodedEmail}')" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-semibold text-gray-200 transition-all">更新</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      async function saveUser(encodedEmail) {
        const newClass = document.getElementById(`class-${encodedEmail}`).value;
        const newRole = document.getElementById(`role-${encodedEmail}`).value;
        const newStatus = document.getElementById(`status-${encodedEmail}`).value;

        try {
          const res = await fetch(`/api/admin/user/${encodedEmail}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userClass: newClass, role: newRole, status: newStatus })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            alert('ユーザー情報およびアカウント状態を更新しました。');
            loadAdminData();
          } else {
            alert('更新に失敗しました: ' + (data.error || '不明なエラー'));
          }
        } catch (err) {
          console.error(err);
          alert('通信エラーが発生しました。');
        }
      }

      async function saveAllSettings() {
        if (!confirm('表示されているすべてのユーザー情報を保存しますか？')) return;

        try {
          for (const u of usersData) {
            const encodedEmail = encodeURIComponent(u.email);
            const newClass = document.getElementById(`class-${encodedEmail}`).value;
            const newRole = document.getElementById(`role-${encodedEmail}` ).value;
            const newStatus = document.getElementById(`status-${encodedEmail}`).value;

            await fetch(`/api/admin/user/${encodedEmail}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userClass: newClass, role: newRole, status: newStatus })
            });
          }
          alert('すべてのユーザー設定を保存しました。');
          loadAdminData();
        } catch (err) {
          console.error(err);
          alert('一括保存中にエラーが発生しました。');
        }
      }

      window.addEventListener('DOMContentLoaded', checkAdminAuthAndLoad);
    </script>
  </body>
</html>
