<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チャット - 並木中等教育学校18回生</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.png" type="image/png" sizes="256x256">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <script src="/socket.io/socket.io.js"></script>
  <!-- Markdownパーサーとサニタイズ用のライブラリを追加 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  
  <style>
    .user-info-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .popup-user-avatar {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 9999px;
      object-fit: cover;
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .user-info-text {
      flex: 1;
      min-width: 0;
    }
    .sidebar-avatar-image,
    .mobile-avatar-image {
      object-fit: cover;
      border-radius: 9999px;
    }
    .chat-layout {
      display: flex;
      height: calc(100vh - 4rem);
      background-color: var(--color-bg);
      border-radius: 0.75rem;
      border: 1px solid var(--color-border);
      overflow: hidden;
    }
    @media (min-width: 1024px) {
      .chat-layout {
        height: calc(100vh - 5rem);
      }
    }
    .chat-channels-sidebar {
      width: 260px;
      background-color: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .chat-channels-header {
      padding: 1rem;
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-channels-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .channel-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.5rem 0.25rem 0.5rem;
      margin-top: 0.5rem;
    }
    .channel-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .add-dm-button {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 0.125rem;
      border-radius: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .add-dm-button:hover {
      color: var(--color-text-primary);
      background-color: var(--color-bg-tertiary);
    }
    .channel-button {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .channel-button:hover {
      background-color: var(--color-bg-tertiary);
      color: var(--color-text-primary);
    }
    .channel-button.active {
      background-color: var(--color-accent-blue-light, #3b82f6);
      color: #ffffff;
    }
    .channel-hash {
      font-weight: 700;
      opacity: 0.7;
    }
    .dm-user-avatar {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 9999px;
      object-fit: cover;
    }
    .chat-main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--color-bg);
    }
    .chat-main-header {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-channel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .chat-channel-description {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-top: 0.125rem;
    }
    .chat-messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .chat-center-message {
      text-align: center;
      margin: 1rem 0;
    }
    .chat-center-message-text {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      background-color: var(--color-bg-secondary);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--color-border);
    }
    .chat-message {
      display: flex;
      gap: 0.75rem;
      max-width: 80%;
    }
    .chat-message--other {
      align-self: flex-start;
    }
    .chat-message--self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-message-avatar {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 9999px;
      object-fit: cover;
      flex-shrink: 0;
      margin-top: 0.125rem;
    }
    .chat-message-content {
      display: flex;
      flex-direction: column;
    }
    .chat-message-content--self {
      align-items: flex-end;
    }
    .chat-message-content--other {
      align-items: flex-start;
    }
    .chat-message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 0.25rem;
      padding: 0 0.25rem;
    }
    .chat-bubble {
      padding: 0.625rem 0.875rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .chat-bubble--other {
      background-color: var(--color-bg-secondary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
      border-top-left-radius: 0.25rem;
    }
    .chat-bubble--self {
      background-color: var(--color-accent-blue-light, #3b82f6);
      color: #ffffff;
      border-top-right-radius: 0.25rem;
    }
    .chat-message-time {
      font-size: 0.6875rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
      padding: 0 0.25rem;
    }
    .chat-input-wrapper {
      padding: 0.875rem 1.25rem;
      border-top: 1px solid var(--color-border);
      background-color: var(--color-bg-secondary);
    }
    .chat-input-form {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      padding: 0.375rem 0.5rem 0.375rem 0.75rem;
    }
    .chat-input-form:focus-within {
      border-color: var(--color-accent-blue-light, #3b82f6);
    }
    .chat-text-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--color-text-primary);
      font-size: 0.875rem;
      outline: none;
    }
    .chat-action-button {
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 0.375rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .chat-action-button:hover {
      color: var(--color-text-primary);
      background-color: var(--color-bg-tertiary);
    }
    .chat-send-button {
      background-color: var(--color-accent-blue-light, #3b82f6);
      color: #ffffff;
      border: none;
      border-radius: 0.375rem;
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: opacity 0.15s ease;
    }
    .chat-send-button:hover {
      opacity: 0.9;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-container {
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      width: 90%;
      max-width: 400px;
      padding: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 0.75rem;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .modal-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 0.375rem;
      color: var(--color-text-primary);
      font-size: 0.875rem;
      outline: none;
    }
    .modal-input:focus {
      border-color: var(--color-accent-blue-light, #3b82f6);
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .modal-btn {
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .modal-btn-secondary {
      background-color: transparent;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }
    .modal-btn-primary {
      background-color: var(--color-accent-blue-light, #3b82f6);
      color: #ffffff;
    }
    @media (max-width: 768px) {
      .chat-channels-sidebar {
        width: 100%;
        display: none;
      }
      .chat-channels-sidebar.show-mobile {
        display: flex;
      }
      .chat-main-area.hide-mobile {
        display: none;
      }
    }
    .auto-link {
      color: var(--color-accent-blue-light, #60a5fa);
      text-decoration: underline;
      word-break: break-all;
    }
    .chat-bubble--self .auto-link {
      color: #ffffff;
      text-decoration: underline;
    }
    .auto-link:hover {
      opacity: 0.8;
    }

    /* Markdown用のスタイル調整 */
    .chat-bubble p {
      margin: 0 0 0.5rem 0;
    }
    .chat-bubble p:last-child {
      margin: 0;
    }
    .chat-bubble h1, .chat-bubble h2, .chat-bubble h3 {
      font-size: 1.1em;
      margin: 0.5rem 0;
      font-weight: bold;
    }
    .chat-bubble ul, .chat-bubble ol {
      margin: 0.5rem 0;
      padding-left: 1.5rem;
    }
    .chat-bubble pre {
      background-color: rgba(0, 0, 0, 0.05);
      padding: 0.5rem;
      border-radius: 0.375rem;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .chat-bubble code {
      background-color: rgba(0, 0, 0, 0.05);
      padding: 0.125rem 0.25rem;
      border-radius: 0.25rem;
      font-family: monospace;
      font-size: 0.85em;
    }
    .chat-bubble blockquote {
      border-left: 3px solid var(--color-border);
      margin: 0.5rem 0;
      padding-left: 0.75rem;
      color: var(--color-text-muted);
    }
    
    /* 自分のメッセージ（青背景）内のMarkdown要素の色調整 */
    .chat-bubble--self a {
      color: #ffffff;
      text-decoration: underline;
    }
    .chat-bubble--self pre,
    .chat-bubble--self code {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .chat-bubble--self blockquote {
      border-left-color: rgba(255, 255, 255, 0.4);
      color: rgba(255, 255, 255, 0.9);
    }
  </style>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('namiki-theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

    <div class="sidebar-footer">

          <img id="popup-user-avatar" src="https://via.placeholder.com/40?text=U" alt="User Avatar" class="popup-user-avatar" onerror="this.src='https://via.placeholder.com/40?text=U'" />

        <button onclick="handleAdminSettings()" class="account-popup-item">
          <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          管理者設定
        </button>
        <button onclick="handlePersonalSettings()" class="account-popup-item">
          <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          個人用設定
        </button>
        
        <button class="account-popup-item toggle-row" onclick="toggleTheme()">
          <div class="flex items-center gap-2">
            <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>

        <button onclick="closeAddDmModal()" class="modal-btn modal-btn-secondary">キャンセル</button>
        <button onclick="handleAddDmSubmit()" class="modal-btn modal-btn-primary">追加</button>

<script>
  let globalData = { profile: null };
  let activeDmUsers = [];
  let currentChannel = 'grade';
  const socket = io();

  // marked.js の初期設定
  if (typeof marked !== 'undefined') {
    marked.use({ breaks: true, gfm: true });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function toggleAccountMenu(event) {
    if (event) event.stopPropagation();
    const menu = document.getElementById('account-popup-menu');
    if (menu) menu.classList.toggle('show');
  }

  document.addEventListener('click', (event) => {
    const menu = document.getElementById('account-popup-menu');
    const toggleBtn = document.getElementById('sidebar-user-toggle');
    if (menu && menu.classList.contains('show')) {
      if (!menu.contains(event.target) && !toggleBtn.contains(event.target)) {
        menu.classList.remove('show');
      }
    }
  });

  function initThemeToggle() {
    const toggleSwitch = document.getElementById('theme-toggle-switch');
    if(toggleSwitch) {
      if (document.documentElement.classList.contains('dark')) {
        toggleSwitch.classList.add('on');
      } else {
        toggleSwitch.classList.remove('on');
      }
    }
  }

  function toggleTheme() {
    const htmlEl = document.documentElement;
    const toggleSwitch = document.getElementById('theme-toggle-switch');
    if (htmlEl.classList.contains('dark')) {
      htmlEl.classList.remove('dark');
      htmlEl.classList.add('light');
      localStorage.setItem('namiki-theme', 'light');
      if (toggleSwitch) toggleSwitch.classList.remove('on');
    } else {
      htmlEl.classList.remove('light');
      htmlEl.classList.add('dark');
      localStorage.setItem('namiki-theme', 'dark');
      if (toggleSwitch) toggleSwitch.classList.add('on');
    }
  }

  function handleAdminSettings() { window.location.href = '/admin'; }
  function handlePersonalSettings() { alert('個人用設定は開発中です。'); }
  function handleAttachment() { alert('ファイルの添付機能は現在準備中です。'); }

  async function loadUserData() {
    try {
      const res = await fetch('/api/profile').catch(() => ({ ok: false }));
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }

      if (res.ok) {
        globalData.profile = await res.json();
      } else {
        globalData.profile = { name: '並木 太郎', email: 'namiki.taro@example.com', id: '180001', role: 'student', userClass: '3-A', picture: '' };
      }
      
      const savedDms = localStorage.getItem('namiki_dm_users');
      if (savedDms) {
        activeDmUsers = JSON.parse(savedDms);
      } else {
        activeDmUsers = [
          { id: 'u1', name: '佐藤 先生', picture: '' },
          { id: '180002', name: '田中 太郎', picture: '' }
        ];
      }

      renderUserProfile();
    } catch (err) {
      console.error('ユーザー情報取得エラー:', err);
    }
  }

  function renderUserProfile() {
    if (!globalData.profile) return;
    const p = globalData.profile;
    const studentIdText = (p.id && p.id !== 'Unknown') ? p.id : '学籍番号未設定';
    
    document.getElementById('sidebar-user-id').textContent = `${studentIdText}`;
    document.getElementById('sidebar-user-name').textContent = p.name || 'ユーザー';
    
    const popupName = document.getElementById('popup-user-name');
    if (popupName) popupName.textContent = p.name || 'ユーザー';
    const popupEmail = document.getElementById('popup-user-email');
    if (popupEmail) popupEmail.textContent = p.email || 'メールアドレス未設定';

    const userAvatar = (p.picture && p.picture !== 'admin.png') ? p.picture : `https://via.placeholder.com/40/3b82f6/ffffff?text=${encodeURIComponent(p.name ? p.name.charAt(0) : 'U')}`;
    
    const sidebarAvatar = document.getElementById('sidebar-user-avatar');
    if (sidebarAvatar) sidebarAvatar.src = userAvatar;

    const mobileAvatar = document.getElementById('mobile-user-avatar');
    if (mobileAvatar) mobileAvatar.src = userAvatar;

    const popupAvatar = document.getElementById('popup-user-avatar');
    if (popupAvatar) popupAvatar.src = userAvatar;

    const classBtnText = document.getElementById('channel-name-class-text');
    if (classBtnText) classBtnText.textContent = p.userClass ? p.userClass : 'クラス';

    renderDMUsers();
    switchChannel(currentChannel);
  }

  function renderDMUsers() {
    const container = document.getElementById('chat-dm-list');
    if (container) {
      container.innerHTML = activeDmUsers.map(u => {
        const avatar = (u.picture && u.picture !== 'admin.png') 
          ? u.picture 
          : `https://via.placeholder.com/32/555/fff?text=${encodeURIComponent(u.name ? u.name.charAt(0) : 'U')}`;
          
        return `
          <button onclick="switchChannel('dm_${u.id}', '${escapeHtml(u.name)}')" id="dm-button-${u.id}" class="channel-button dm-user-button">
            <img src="${avatar}" class="dm-user-avatar" alt="Avatar" onerror="this.src='https://via.placeholder.com/32?text=U'" />
            <span class="truncate">${escapeHtml(u.name)}</span>
          </button>
        `;
      }).join('');
    }
  }

  function openAddDmModal() {
    document.getElementById('add-dm-user-id').value = '';
    document.getElementById('add-dm-modal').classList.add('show');
    document.getElementById('add-dm-user-id').focus();
  }

  function closeAddDmModal() {
    document.getElementById('add-dm-modal').classList.remove('show');
  }

  async function handleAddDmSubmit() {
    const inputId = document.getElementById('add-dm-user-id').value.trim();
    if (!inputId) {
      alert('IDを入力してください。');
      return;
    }

    if (globalData.profile && String(globalData.profile.id) === inputId) {
      alert('自分自身を追加することはできません。');
      return;
    }

    if (activeDmUsers.some(u => String(u.id) === inputId)) {
      alert('このユーザーはすでに追加されています。');
      closeAddDmModal();
      switchChannel(`dm_${inputId}`, activeDmUsers.find(u => String(u.id) === inputId).name);
      return;
    }

    try {
      const res = await fetch('/api/admin/users').catch(() => null);
      if (!res || !res.ok) {
        alert('ユーザー情報の取得に失敗しました。');
        return;
      }

      const userList = await res.json();
      const targetUser = userList.find(u => String(u.id) === inputId);

      if (targetUser) {
        const newUser = {
          id: String(targetUser.id),
          name: targetUser.name || `ユーザー (${targetUser.id})`,
          picture: targetUser.picture || ''
        };

        activeDmUsers.push(newUser);
        localStorage.setItem('namiki_dm_users', JSON.stringify(activeDmUsers));
        
        renderDMUsers();
        closeAddDmModal();
        switchChannel(`dm_${newUser.id}`, newUser.name);
      } else {
        alert(`ID: "${inputId}" のユーザーは見つかりませんでした。`);
      }
    } catch (err) {
      console.error('DMユーザー追加エラー:', err);
      alert('ユーザー情報の取得中にエラーが発生しました。');
    }
  }

  async function switchChannel(channelId, name = '') {
    currentChannel = channelId;
    document.querySelectorAll('.channel-button').forEach(btn => btn.classList.remove('active'));

    const titleEl = document.getElementById('chat-channel-title');
    const descEl = document.getElementById('chat-channel-description');

    if (channelId === 'grade') {
      document.getElementById('channel-button-grade')?.classList.add('active');
      titleEl.innerHTML = '<span class="channel-hash">#</span> 学年全体チャット';
      descEl.textContent = '学年全員で交流・情報共有するチャンネルです。';
    } else if (channelId === 'class') {
      document.getElementById('channel-button-class')?.classList.add('active');
      const cls = globalData.profile?.userClass || 'クラス未設定';
      titleEl.innerHTML = `<span class="channel-hash">#</span> ${cls} チャット`;
      descEl.textContent = `${cls}の生徒専用の連絡・相談チャンネルです。`;
    } else if (channelId.startsWith('dm_')) {
      const userId = channelId.replace('dm_', '');
      document.getElementById(`dm-button-${userId}`)?.classList.add('active');
      titleEl.innerHTML = `<span class="channel-hash">@</span> ${escapeHtml(name)}`;
      descEl.textContent = `${escapeHtml(name)}さんとのプライベートメッセージです。`;
    }

    socket.emit('joinChannel', currentChannel);
    await loadMessages(currentChannel);
    sendReadSignal();
  }

  function sendReadSignal() {
    if (globalData.profile?.email) {
      socket.emit('markAsRead', {
        channel: currentChannel,
        userEmail: globalData.profile.email
      });
    }
  }

  async function loadMessages(channel) {
    const container = document.getElementById('chat-messages-list');
    container.innerHTML = '<div class="chat-center-message"><div class="chat-center-message-text">読み込み中...</div></div>';
    
    try {
      const res = await fetch(`/api/chat/messages?channel=${encodeURIComponent(channel)}`);
      if (res.ok) {
        const data = await res.json();
        container.innerHTML = '';
        if (data.messages.length === 0) {
          container.innerHTML = '<div class="chat-center-message"><div class="chat-center-message-text">メッセージはまだありません。</div></div>';
        } else {
          data.messages.forEach(appendMessage);
        }
      }
    } catch (e) {
      container.innerHTML = '<div class="chat-center-message"><div class="chat-center-message-text">メッセージの取得に失敗しました。</div></div>';
    }
  }

  function appendMessage(msg) {
    const container = document.getElementById('chat-messages-list');
    
    if (msg.id && document.querySelector(`[data-msg-id="${msg.id}"]`)) {
      return; 
    }

    const isSelf = msg.senderEmail ? (msg.senderEmail === globalData.profile?.email) : (msg.sender === globalData.profile?.name);
    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    const avatarSrc = isSelf ? (globalData.profile?.picture || 'https://via.placeholder.com/32/333/fff?text=Me') : (msg.senderPicture || 'https://via.placeholder.com/32/555/fff?text=U');

    const isAdmin = globalData.profile?.role === 'admin';
    const canDelete = isSelf || isAdmin;
    const deleteBtnHtml = (canDelete && msg.id) 
      ? `<button onclick="deleteMessage('${msg.id}')" style="background:none; border:none; color:var(--color-text-muted); cursor:pointer; font-size:0.6875rem; padding:0; margin-left:0.25rem;" title="削除">削除</button>` 
      : '';

    let readStatusHtml = '';
    if (isSelf && msg.readBy && msg.readBy.length > 0) {
      const isDm = currentChannel.startsWith('dm_');
      const readText = isDm ? '既読' : `既読 ${msg.readBy.length}`;
      readStatusHtml = `<span class="chat-message-read" style="font-size:0.6875rem; color:var(--color-text-muted); margin-right:0.25rem;">${readText}</span>`;
    }

    // Markdownのパースとサニタイズ処理
    const rawHtml = msg.text && typeof marked !== 'undefined' ? marked.parse(msg.text) : escapeHtml(msg.text);
    const safeHtml = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(rawHtml) : rawHtml;

    const msgDiv = document.createElement('div');
    msgDiv.className = `chat-message ${isSelf ? 'chat-message--self' : 'chat-message--other'}`;
    if (msg.id) msgDiv.setAttribute('data-msg-id', msg.id);

    msgDiv.innerHTML = `
      <img src="${escapeHtml(avatarSrc)}" class="chat-message-avatar" alt="Avatar" onerror="this.src='https://via.placeholder.com/32?text=U'" />
      <div class="chat-message-content ${isSelf ? 'chat-message-content--self' : 'chat-message-content--other'}">
        ${!isSelf ? `<span class="chat-message-sender">${escapeHtml(msg.sender)}</span>` : ''}
        <div class="chat-bubble ${isSelf ? 'chat-bubble--self' : 'chat-bubble--other'}">
          ${safeHtml}
        </div>
        <div class="flex items-center gap-1" style="display:flex; align-items:center;">
          ${readStatusHtml}
          <span class="chat-message-time">${timeStr}</span>
          ${deleteBtnHtml}
        </div>
      </div>
    `;
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }

  async function deleteMessage(msgId) {
    try {
      const res = await fetch(`/api/chat/messages/${msgId}?channel=${encodeURIComponent(currentChannel)}`, {
        method: 'DELETE'
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || '削除権限がありません。');
      }
    } catch (e) {
      console.error('削除エラー:', e);
    }
  }

  async function handleChatSubmit(event) {
    event.preventDefault();
    const input = document.getElementById('chat-message-input');
    const text = input.value.trim();
    if (!text) return;

    try {
      const res = await fetch('/api/chat/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel: currentChannel, text })
      });
      if (res.ok) {
        input.value = '';
      } else {
        alert('送信に失敗しました。');
      }
    } catch (e) {
      console.error('送信エラー:', e);
    }
  }

  socket.on('chatMessage', (msg) => {
    if (msg.channel === currentChannel || !msg.channel) {
      appendMessage(msg);
      if (msg.senderEmail !== globalData.profile?.email) {
        sendReadSignal();
      }
    }
  });

  socket.on('messagesReadUpdated', (data) => {
    if (data.channel === currentChannel) {
      const container = document.getElementById('chat-messages-list');
      container.innerHTML = '';
      data.messages.forEach(appendMessage);
    }
  });

  socket.on('chatMessageDeleted', (data) => {
    if (data.id) {
      const msgEl = document.querySelector(`[data-msg-id="${data.id}"]`);
      if (msgEl) msgEl.remove();
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    initThemeToggle();
