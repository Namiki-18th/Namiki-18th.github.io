  <script nonce="%%CSP_NONCE%%">
    let globalData = {
      profile: null,
      schedule: null
    };

    let currentClass = 'A'; // デフォルトクラス
    let currentWeek = 'A';  // デフォルト週

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleAccountMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('account-popup-menu');
      if (menu) menu.classList.toggle('show');
    }

    document.addEventListener('click', (event) => {
      const menu = document.getElementById('account-popup-menu');
      const toggleBtn = document.getElementById('sidebar-user-toggle');
      if (menu && menu.classList.contains('show')) {
        if (!menu.contains(event.target) && !toggleBtn.contains(event.target)) {
          menu.classList.remove('show');
        }
      }
    });

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      if(toggleSwitch) {
        if (document.documentElement.classList.contains('dark')) {
          toggleSwitch.classList.add('on');
        } else {
          toggleSwitch.classList.remove('on');
        }
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        localStorage.setItem('namiki-theme', 'light');
        if (toggleSwitch) toggleSwitch.classList.remove('on');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        localStorage.setItem('namiki-theme', 'dark');
        if (toggleSwitch) toggleSwitch.classList.add('on');
      }
    }

    function handleAdminSettings() { window.location.href = '/admin'; }
    function handlePersonalSettings() { window.location.href = '/setting'; }

    /* クラス切り替えのロジック */
    function switchClass(cls) {
      currentClass = cls;
      ['A', 'B', 'C', 'D'].forEach(c => {
        const btn = document.getElementById(`btn-class-${c.toLowerCase()}`);
        if (btn) btn.classList.toggle('active', c === cls);
      });
      renderSchedule();
    }

    /* 週切り替えのロジック */
    function switchWeek(week) {
      currentWeek = week;
      document.getElementById('btn-week-a').classList.toggle('active', week === 'A');
      document.getElementById('btn-week-b').classList.toggle('active', week === 'B');
      renderSchedule();
    }

    async function loadScheduleData() {
      try {
        const [profileRes, scheduleRes] = await Promise.all([
          fetch('/api/profile').catch(() => ({ ok: false })),
          fetch('/api/schedule').catch(() => ({ ok: false }))
        ]);

        if (profileRes.status === 401) {
          window.location.href = '/login';
          return;
        }

        if (profileRes.ok) globalData.profile = await profileRes.json();
        else globalData.profile = { name: '並木 太郎', email: 'namiki.taro@example.com', id: '180001', role: 'student', userClass: '2-A', picture: '' };

        if (scheduleRes.ok) {
          globalData.schedule = await scheduleRes.json();
        } else {
        }

        renderAll();
      } catch (err) {
        console.error('データ取得エラー:', err);
      }
    }

    function renderAll() {
      if (globalData.profile) {
        const p = globalData.profile;
        const studentIdText = (p.id && p.id !== 'Unknown') ? p.id : '学籍番号未設定';
        document.getElementById('sidebar-user-id').textContent = `${studentIdText}`;
        document.getElementById('sidebar-user-name').textContent = p.name || 'ユーザー';
        
        const popupName = document.getElementById('popup-user-name');
        if (popupName) popupName.textContent = p.name || 'ユーザー';
        const popupEmail = document.getElementById('popup-user-email');
        if (popupEmail) popupEmail.textContent = p.email || 'メールアドレス未設定';

        const userAvatar = (p.picture && p.picture !== 'admin.png') ? p.picture : `https://via.placeholder.com/40/3b82f6/ffffff?text=${encodeURIComponent(p.name ? p.name.charAt(0) : 'U')}`;
        
        const sidebarAvatar = document.getElementById('sidebar-user-avatar');
        if (sidebarAvatar) sidebarAvatar.src = userAvatar;

        const mobileAvatar = document.getElementById('mobile-user-avatar');
        if (mobileAvatar) mobileAvatar.src = userAvatar;

        const popupAvatar = document.getElementById('popup-user-avatar');
        if (popupAvatar) popupAvatar.src = userAvatar;
      }

      renderSchedule();
    }

    function renderSchedule() {
      const classKey = `2-${currentClass}`;
      const classData = globalData.schedule && globalData.schedule[classKey];
      const container = document.getElementById('schedule-container');

      if (!classData) {
        container.innerHTML = `<div class="empty-state-text gen-e86cdd">${escapeHtml(classKey)}組の時間割データはありません。</div>`;
        return;
      }

      const weekData = currentWeek === 'A' ? classData.weekA : classData.weekB;
      const dayKeys = [
        { key: 'mon', label: '月' },
        { key: 'tue', label: '火' },
        { key: 'wed', label: '水' },
        { key: 'thu', label: '木' },
        { key: 'fri', label: '金' },
        { key: 'c',   label: 'C' }
      ];

      container.innerHTML = dayKeys.map(d => {
        const periods = weekData ? (weekData[d.key] || []) : [];
        return `
          <div class="day-column">
            <div class="day-header">${d.label}曜日</div>
            ${periods.map(p => `
              <div class="period-card">
                <div class="period-subject">${escapeHtml(p.subject)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    // 💡CSP対応: インラインイベント属性(onclick/onerror)を廃止し、
    // addEventListener によるイベント登録に統一。
    function initInlineEventReplacements() {
      // ナビゲーション（data-href属性を持つ要素はクリックで遷移）
      document.querySelectorAll('[data-href]').forEach(el => {
        el.addEventListener('click', () => {
          location.href = el.getAttribute('data-href');
        });
      });

      // ロゴ画像の読み込み失敗時、絵文字フォールバックを表示
      document.querySelectorAll('.js-logo-fallback').forEach(img => {
        img.addEventListener('error', function () {
          // 直接スタイルをいじらず、クラスの付け外しを行う
          this.classList.add('gen-93b8ea'); // 画像に display:none のクラスを追加して隠す
          
          if (this.nextElementSibling) {
            this.nextElementSibling.classList.remove('gen-93b8ea'); // 絵文字から display:none を外して表示する
          }
        });
      });

      // アカウントメニュー開閉
      const sidebarUserToggle = document.getElementById('sidebar-user-toggle');
      if (sidebarUserToggle) {
        sidebarUserToggle.addEventListener('click', (event) => toggleAccountMenu(event));
      }

      // 管理者設定 / 個人設定 / テーマ切り替え（ポップアップ内・モバイル両方）
      const btnAdminSettings = document.getElementById('btn-admin-settings');
      if (btnAdminSettings) btnAdminSettings.addEventListener('click', handleAdminSettings);

      const btnPersonalSettings = document.getElementById('btn-personal-settings');
      if (btnPersonalSettings) btnPersonalSettings.addEventListener('click', handlePersonalSettings);

      const btnToggleThemePopup = document.getElementById('btn-toggle-theme-popup');
      if (btnToggleThemePopup) btnToggleThemePopup.addEventListener('click', toggleTheme);

      const btnToggleThemeMobile = document.getElementById('btn-toggle-theme-mobile');
      if (btnToggleThemeMobile) btnToggleThemeMobile.addEventListener('click', toggleTheme);

      // クラス切り替えボタン（data-class属性からクラスを取得）
      document.querySelectorAll('[data-class]').forEach(btn => {
        btn.addEventListener('click', () => switchClass(btn.getAttribute('data-class')));
      });

      // 週切り替えボタン（data-week属性から週を取得）
      document.querySelectorAll('[data-week]').forEach(btn => {
        btn.addEventListener('click', () => switchWeek(btn.getAttribute('data-week')));
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initInlineEventReplacements();
      loadScheduleData()
    });
  </script>
</body>
</html>
