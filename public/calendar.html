    let calendarCurrentDate = new Date();
    let calendarEvents = [];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleAccountMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('account-popup-menu');
      if (menu) menu.classList.toggle('show');
    }

    function initThemeToggle() {
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      if (toggleSwitch) {
        if (document.documentElement.classList.contains('dark')) {
          toggleSwitch.classList.add('on');
        } else {
          toggleSwitch.classList.remove('on');
        }
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const toggleSwitch = document.getElementById('theme-toggle-switch');
      
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        localStorage.setItem('namiki-theme', 'light');
        if (toggleSwitch) toggleSwitch.classList.remove('on');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        localStorage.setItem('namiki-theme', 'dark');
        if (toggleSwitch) toggleSwitch.classList.add('on');
      }
    }

    function handleAdminSettings() { window.location.href = '/admin'; }
    function handlePersonalSettings() { alert('個人用設定は開発中です。'); }

    async function loadPageData() {
      try {
        const [profileRes, calendarRes] = await Promise.all([
          fetch('/api/profile').catch(err => ({ ok: false })),
          fetch('/api/calendar').catch(err => ({ ok: false }))
        ]);

        if (profileRes.status === 401) {
          window.location.href = '/login';
          return;
        }

        if (profileRes.ok) {
          globalData.profile = await profileRes.json();
        }

        if (calendarRes.ok) {
          const apiCalendar = await calendarRes.json();
          globalData.calendar = (apiCalendar && apiCalendar.length > 0) ? apiCalendar : defaultCalendarData;
        } else {
          globalData.calendar = defaultCalendarData;
        }
      } catch (err) {
        console.error('データ取得エラー:', err);
        globalData.calendar = defaultCalendarData;
      } finally {
        renderUserInfo();
        initializeCalendar(globalData.calendar);
      }
    }

    function renderUserInfo() {
      if (globalData.profile) {
        const p = globalData.profile;
        const studentIdText = (p.id && p.id !== 'Unknown') ? p.id : '学籍番号未設定';
        document.getElementById('sidebar-user-id').textContent = `${studentIdText}`;
        document.getElementById('sidebar-user-name').textContent = p.name || 'ユーザー';
        
        const popupName = document.getElementById('popup-user-name');
        if (popupName) popupName.textContent = p.name || 'ユーザー';
        const popupEmail = document.getElementById('popup-user-email');
        if (popupEmail) popupEmail.textContent = p.email || 'メールアドレス未設定';

        const userAvatar = (p.picture && p.picture !== 'admin.png') ? p.picture : `https://via.placeholder.com/40/3b82f6/ffffff?text=${encodeURIComponent(p.name ? p.name.charAt(0) : 'U')}`;
        
        const sidebarAvatar = document.getElementById('sidebar-user-avatar');
        if (sidebarAvatar) sidebarAvatar.src = userAvatar;

        const mobileAvatar = document.getElementById('mobile-user-avatar');
        if (mobileAvatar) mobileAvatar.src = userAvatar;

        const popupAvatar = document.getElementById('popup-user-avatar');
        if (popupAvatar) popupAvatar.src = userAvatar;
      }
    }

    function initializeCalendar(events) {
      calendarEvents = events || [];
      calendarCurrentDate = new Date();
      renderCalendar();
    }

    function renderCalendar() {
      const year = calendarCurrentDate.getFullYear();
      const month = calendarCurrentDate.getMonth();

      const titleEl = document.getElementById('calendar-month-title');
      if (titleEl) {
        titleEl.textContent = `${year}年 ${month + 1}月`;
      }

      const firstDay = new Date(year, month, 1);
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      const calendarDays = [];
      const currentDate = new Date(startDate);
      while (calendarDays.length < 42) {
        calendarDays.push(new Date(currentDate));
        currentDate.setDate(currentDate.getDate() + 1);
      }

      const tbody = document.getElementById('calendar-body');
      if (!tbody) return;

      let html = '';
      
      for (let i = 0; i < calendarDays.length; i += 7) {
        html += '<tr class="gen-886808">';
        
        const weekDays = calendarDays.slice(i, i + 7);
        const eventsPerDay = weekDays.map(day => {
          return calendarEvents.filter(e => {
            const eventDate = new Date(e.date);
            return eventDate.getFullYear() === day.getFullYear() &&
                   eventDate.getMonth() === day.getMonth() &&
                   eventDate.getDate() === day.getDate();
          });
        });

        const slots = [];
        for (let j = 0; j < 7; j++) {
          let unassignedEvents = [...eventsPerDay[j]];
          
          for (let s = 0; s < slots.length; s++) {
            if (j > 0 && slots[s][j-1]) {
              const prevEvent = slots[s][j-1];
              const matchingEventIndex = unassignedEvents.findIndex(e => e.title === prevEvent.title);
              if (matchingEventIndex !== -1) {
                slots[s][j] = unassignedEvents[matchingEventIndex];
                unassignedEvents.splice(matchingEventIndex, 1);
              } else {
                slots[s][j] = null;
              }
            } else {
              slots[s][j] = null;
            }
          }
          
          for (const event of unassignedEvents) {
            let placed = false;
            for (let s = 0; s < slots.length; s++) {
              if (!slots[s][j]) {
                slots[s][j] = event;
                placed = true;
                break;
              }
            }
            if (!placed) {
              const newSlot = Array(7).fill(null);
              newSlot[j] = event;
              slots.push(newSlot);
            }
          }
        }

        for (let j = 0; j < 7; j++) {
          const day = weekDays[j];
          const dayNum = day.getDate();
          const isCurrentMonth = day.getMonth() === month;
          const isToday = day.toDateString() === new Date().toDateString();

          const bgColor = isCurrentMonth ? 'var(--color-bg-secondary)' : 'var(--color-bg-tertiary)';
          const baseTextColor = isCurrentMonth ? 'var(--color-text-primary)' : 'var(--color-text-muted)';
          const todayBorder = isToday ? '2px solid var(--color-accent-blue-light)' : 'none';

          // 休日判定（type === 'holiday' のイベントがあるか）
          const hasHoliday = eventsPerDay[j].some(e => e.type === 'holiday');
          
          // ヘッダーの色を決定（日曜または休日なら赤、土曜なら青、それ以外は通常色）
          let headerColor = baseTextColor;
          if (j===6) {
            headerColor = '#3b82f6'
          } else if (hasHoliday || j === 0) {
            headerColor = '#f87171'
          }
          
          const fontWeight = isToday ? '700' : '500';

          let dayHtml = '';
          let overflowCount = 0;
          const MAX_SLOTS = 2;

          for (let s = 0; s < slots.length; s++) {
            const event = slots[s][j];
            if (s < MAX_SLOTS) {
              if (event) {
                const isContinuedFromPrev = j > 0 && slots[s][j-1] && slots[s][j-1].title === event.title;
                const isContinuesToNext = j < 6 && slots[s][j+1] && slots[s][j+1].title === event.title;
                
                let styles = `padding: 0.25rem 0.375rem; margin-bottom: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.75rem; height: 1.5rem; line-height: 1rem; box-sizing: border-box;`;
                
                if (isContinuedFromPrev) {
                  styles += ` margin-left: -0.5rem; padding-left: 0.5rem; border-top-left-radius: 0; border-bottom-left-radius: 0;`;
                } else {
                  styles += ` border-top-left-radius: 0.25rem; border-bottom-left-radius: 0.25rem;`;
                }
                
                if (isContinuesToNext) {
                  styles += ` margin-right: -0.5rem; padding-right: 0.5rem; border-top-right-radius: 0; border-bottom-right-radius: 0;`;
                } else {
                  styles += ` border-top-right-radius: 0.25rem; border-bottom-right-radius: 0.25rem;`;
                }

                const finalDisplayText = (!isContinuedFromPrev || j === 0) ? escapeHtml(event.title) : '&nbsp;';
                const chipClass = event.type === 'no-vacation' ? 'event-chip-no-vacation' : 'event-chip-event';
                
                dayHtml += `<div class="${chipClass}" style="${styles}" title="${escapeHtml(event.title)}">${finalDisplayText}</div>`;
              } else {
                dayHtml += `<div class="gen-14ec71"></div>`;
              }
            } else {
              if (event) overflowCount++;
            }
          }
          
          if (overflowCount > 0) {
            dayHtml += `<div class="gen-de800b">+${overflowCount}件</div>`;
          }

          const dateString = `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;

          html += `
            <td class="calendar-cell" style="height: 100px; padding: 0.5rem; background: ${bgColor}; border: ${todayBorder}; vertical-align: top; color: ${headerColor}; font-weight: ${fontWeight}; cursor: pointer; transition: background 0.2s;" data-date="${dateString}">
              <div class="gen-682d69">${dayNum}</div>
              <div class="gen-af89d6">
                ${dayHtml}
              </div>
            </td>
          `;
        }
        html += '</tr>';
      }
      tbody.innerHTML = html;
    }

    function showDayDetails(dateStr) {
      const events = calendarEvents.filter(e => e.date === dateStr);
      const modalDateTitle = document.getElementById('modal-date-title');
      const modalContainer = document.getElementById('modal-events-container');
      
      const d = new Date(dateStr);
      modalDateTitle.textContent = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日の予定`;
      
      if (events.length === 0) {
        modalContainer.innerHTML = '<p class="gen-30184a">この日の予定はありません。</p>';
      } else {
        modalContainer.innerHTML = events.map(e => {
          let eventTypeLabel = '';
          if (e.type === 'holiday') eventTypeLabel = '休日・祝日等';
          else if (e.type === 'test') eventTypeLabel = 'テスト';
          else if (e.type === 'ceremony') eventTypeLabel = '式典';
          else if (e.type === 'school-event') eventTypeLabel = '学校行事';
          else eventTypeLabel = 'イベント';

          return `
            <div class="gen-e5c627">
              <div class="gen-1aecdc">${escapeHtml(e.title)}</div>
              <div class="gen-9803d8">
                分類: ${eventTypeLabel}
              </div>
            </div>
          `;
        }).join('');
      }
      
      document.getElementById('day-modal').classList.add('show');
    };

    function closeDayModal() {
      document.getElementById('day-modal').classList.remove('show');
    };

    function previousMonth() {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + 1);
      renderCalendar();
    }

    // イベントリスナーの登録（CSP対応）
    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      loadPageData();

      // 画像のエラーフォールバック
      document.querySelectorAll('img.fallback-logo-img').forEach(img => {
        img.addEventListener('error', function() {
          this.style.display = 'none';
          const sibling = this.parentElement.querySelector('.fallback-logo-emoji');
          if (sibling) sibling.style.display = 'inline';
        });
      });
      document.querySelectorAll('img.sidebar-avatar-image, img.mobile-avatar-image, img.popup-user-avatar').forEach(img => {
        img.addEventListener('error', function() {
          this.src = 'https://via.placeholder.com/40?text=U';
        });
      });

      // ナビゲーションリンク
      document.querySelectorAll('.nav-link').forEach(btn => {
        btn.addEventListener('click', function() {
          if (this.dataset.href) {
            location.href = this.dataset.href;
          }
        });
      });

      // アカウントメニュー周り
      const sidebarToggle = document.getElementById('sidebar-user-toggle');
      if (sidebarToggle) sidebarToggle.addEventListener('click', toggleAccountMenu);
      
      const adminBtn = document.getElementById('btn-admin-settings');
      if (adminBtn) adminBtn.addEventListener('click', handleAdminSettings);

      const personalBtn = document.getElementById('btn-personal-settings');
      if (personalBtn) personalBtn.addEventListener('click', handlePersonalSettings);

      const themeToggle = document.getElementById('btn-theme-toggle');
      if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

      const mobileThemeToggle = document.getElementById('btn-mobile-theme-toggle');
      if (mobileThemeToggle) mobileThemeToggle.addEventListener('click', toggleTheme);

      // カレンダーの月切り替え
      const prevBtn = document.getElementById('calendar-prev-btn');
      if (prevBtn) prevBtn.addEventListener('click', previousMonth);

      const nextBtn = document.getElementById('calendar-next-btn');
      if (nextBtn) nextBtn.addEventListener('click', nextMonth);

      // カレンダーセルのクリック（イベント委譲）
      const calendarBody = document.getElementById('calendar-body');
      if (calendarBody) {
        calendarBody.addEventListener('click', (e) => {
          const cell = e.target.closest('.calendar-cell');
          if (cell && cell.dataset.date) {
            showDayDetails(cell.dataset.date);
          }
        });
      }

      // モーダル周り
      const modalOverlay = document.getElementById('day-modal');
      if (modalOverlay) modalOverlay.addEventListener('click', closeDayModal);

      const modalContentBox = document.getElementById('modal-content-box');
      if (modalContentBox) modalContentBox.addEventListener('click', (e) => e.stopPropagation());

      const modalCloseBtn = document.getElementById('modal-close-btn');
      if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeDayModal);

      // メニュー外のクリック処理
      document.addEventListener('click', (event) => {
        const menu = document.getElementById('account-popup-menu');
        const toggleBtn = document.getElementById('sidebar-user-toggle');
        if (menu && menu.classList.contains('show')) {
          if (!menu.contains(event.target) && toggleBtn && !toggleBtn.contains(event.target)) {
            menu.classList.remove('show');
          }
        }
      });
    });
